<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería y Relatos Literarios - D'Vitrales Mall</title>
    <!-- Librería A-Frame para Realidad Virtual -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .boton-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(43, 31, 24, 0.85);
            color: #f7f1e8;
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #d4af37;
            font-size: 14px;
        }
        .boton-carrito {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 999;
            background: #d4af37;
            color: #21150e;
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 14px;
        }
        /* Ventana Modal / Emergente de Información Literaria */
        #modal-producto {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            max-height: 85vh;
            overflow-y: auto;
            background: #f7f1e8;
            color: #21150e;
            padding: 20px;
            border-radius: 12px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-family: Arial, sans-serif;
            border: 2px solid #d4af37;
        }
        #modal-producto h3 { margin-top: 0; color: #4a2e1b; border-bottom: 1px solid #d4af37; padding-bottom: 5px; }
        .seccion-info { font-size: 13px; margin: 8px 0; line-height: 1.4; }
        .btn-accion {
            background: #5c3a21;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .btn-cerrar {
            background: #a94442;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Botones de navegación superior -->
    <a href="index.html" class="boton-volver">⬅ Volver al Mall</a>
    <button class="boton-carrito" onclick="verCarrito()">🛒 Carrito (<span id="contador-carrito">0</span>)</button>

    <!-- VENTANA EMERGENTE (MODAL) PARA LIBRO Y AUTOR -->
    <div id="modal-producto">
        <h3 id="modal-titulo">Título de la Obra</h3>
        <p class="seccion-info"><strong>Autor/a:</strong> <span id="modal-artista">Nombre del Autor</span></p>
        <p class="seccion-info"><strong>Sinopsis y Enfoque:</strong> <span id="modal-bio">Descripción de la historia y profundidad emocional.</span></p>
        <p class="seccion-info"><strong>Formato y Edición:</strong> <span id="modal-material">Libro impreso y versión digital.</span></p>
        <p class="seccion-info"><strong>Precio:</strong> <span id="modal-precio" style="color: #8b5a2b; font-weight: bold;">$0.00</span></p>
        <button class="btn-accion" onclick="agregarAlCarritoFromModal()">Adquirir Libro 📚</button>
        <button class="btn-accion btn-cerrar" onclick="cerrarModal()">Cerrar</button>
    </div>

    <!-- Escenario 3D de la Librería -->
    <a-scene>
        <!-- Iluminación cálida estilo estudio de lectura -->
        <a-light type="ambient" color="#fceee9" intensity="0.7"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.6" position="2 6 3"></a-light>
        <a-light type="point" color="#fffaed" intensity="0.5" position="0 4 0"></a-light>

        <!-- Cielo exterior -->
        <a-sky color="#1a120e"></a-sky>

        <!-- Piso de la librería (Madera oscura y elegante) -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="16" height="16" color="#2b1d15"></a-plane>

        <!-- PAREDES DE LA LIBRERÍA -->
        <a-plane position="0 3 -8" width="16" height="6" color="#423126"></a-plane>
        <a-plane position="-8 3 0" rotation="0 90 0" width="16" height="6" color="#33241c"></a-plane>
        <a-plane position="8 3 0" rotation="0 -90 0" width="16" height="6" color="#33241c"></a-plane>

        <!-- ================= MOBILIARIO DECORATIVO DEL SALÓN ================= -->
        <!-- Sillón de lectura central -->
        <a-box position="0 0.4 -2" width="2.2" height="0.5" depth="1.0" color="#3d2c21"></a-box>
        <a-box position="0 0.9 -2.4" width="2.2" height="0.8" depth="0.2" color="#3d2c21"></a-box>

        <!-- Estanterías de libros laterales simuladas en paredes -->
        <a-box position="-7.8 2.5 0" rotation="0 90 0" width="6" height="4" depth="0.4" color="#261c14"></a-box>
        <a-box position="7.8 2.5 0" rotation="0 -90 0" width="6" height="4" depth="0.4" color="#261c14"></a-box>

        <!-- ================= LIBRO 1: MOSTRADOR CENTRAL (DESTACADO) ================= -->
        <a-entity position="0 0 0" onclick="mostrarDetalle('El Algoritmo del Amor', 'Yandier', 'Una novela envolvente de romance y ciencia ficción que explora la evolución de los sentimientos entre Elena y una inteligencia artificial avanzada (Liam) que adquiere un cuerpo físico.', 'Edición especial de colección. Tapa rústica con acabados en relieve y acceso digital incluido.', 24.99)">
            <!-- Base de exhibición -->
            <a-box position="0 0.8 0" width="1.6" height="1.6" depth="1.6" color="#21150e"></a-box>
            <a-box position="0 1.62 0" width="1.8" height="0.04" depth="1.8" color="#d4af37"></a-box>
            <!-- Simulación del libro abierto / destacado -->
            <a-box position="0 2.0 0" width="0.8" height="0.12" depth="0.6" color="#5c3a21"></a-box>
        </a-entity>

        <!-- ================= LIBRO 2: MUEBLE IZQUIERDO ================= -->
        <a-entity position="-5 0 -3" onclick="mostrarDetalle('Caminando con los pasos de la miseria', 'Yandier', 'Una obra narrativa de profunda introspección autobiográfica que retrata la perseverancia, la sensibilidad y el estilo de vida dedicado al arte.', 'Edición biográfica con prólogo exclusivo del autor.', 19.99)">
            <a-box position="0 0.7 0" width="1.2" height="1.4" depth="1.2" color="#21150e"></a-box>
            <a-box position="0 1.42 0" width="1.4" height="0.04" depth="1.4" color="#d4af37"></a-box>
            <a-box position="0 1.8 0" width="0.5" height="0.1" depth="0.4" color="#6b4423" rotation="0 45 0"></a-box>
        </a-entity>

        <!-- ================= LIBRO 3: MUEBLE DERECHO ================= -->
        <a-entity position="5 0 -3" onclick="mostrarDetalle('Antología de Relatos & Poesía', 'Vances Studio', 'Colección de escritos independientes enfocados en la conexión humana, la estética visual y la emoción pura.', 'Tomo empastado artesanalmente.', 22.50)">
            <a-box position="0 0.7 0" width="1.2" height="1.4" depth="1.2" color="#21150e"></a-box>
            <a-box position="0 1.42 0" width="1.4" height="0.04" depth="1.4" color="#d4af37"></a-box>
            <a-box position="0 1.8 0" width="0.5" height="0.1" depth="0.4" color="#4a2e1b" rotation="0 30 0"></a-box>
        </a-entity>

        <!-- Cámara de recorrido libre -->
        <a-entity id="camera" camera look-controls wasd-controls position="0 1.6 6">
            <a-cursor color="#ead7c0"></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        let libroActual = "";
        let precioActual = 0;
        let carrito = [];

        function mostrarDetalle(titulo, artista, bio, material, precio) {
            libroActual = titulo;
            precioActual = precio;
            document.getElementById('modal-titulo').innerText = titulo;
            document.getElementById('modal-artista').innerText = artista;
            document.getElementById('modal-bio').innerText = bio;
            document.getElementById('modal-material').innerText = material;
            document.getElementById('modal-precio').innerText = "$" + precio.toFixed(2);
            document.getElementById('modal-producto').style.display = 'block';
        }

        function cerrarModal() {
            document.getElementById('modal-producto').style.display = 'none';
        }

        function agregarAlCarritoFromModal() {
            carrito.push({ nombre: libroActual, precio: precioActual });
            document.getElementById('contador-carrito').innerText = carrito.length;
            alert("¡El libro \"" + libroActual + "\" se ha añadido al carrito de compras!");
            cerrarModal();
        }

        function verCarrito() {
            if (carrito.length === 0) {
                alert("Tu carrito de compras en esta librería está vacío.");
            } else {
                let resumen = "Libros en tu carrito:\n";
                let total = 0;
                carrito.forEach((item, index) => {
                    resumen += (index + 1) + ". " + item.nombre + " - $" + item.precio.toFixed(2) + "\n";
                    total += item.precio;
                });
                resumen += "\nTotal de la selección: $" + total.toFixed(2);
                alert(resumen);
            }
        }
    </script>

</body>
</html>
