<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería y Sala de Series 3D - D'Vitrales Mall</title>
    <!-- Librería A-Frame para Realidad Virtual -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .boton-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(63, 48, 37, 0.85);
            color: #f7f1e8;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #ead7c0;
        }
    </style>
</head>
<body>

    <!-- Botón para regresar al centro comercial -->
    <a href="index.html" class="boton-volver">⬅ Volver al Centro Comercial</a>

    <!-- Escenario 3D Dual: Librería y Zona de Series -->
    <a-scene>
        <!-- Iluminación cálida y acogedora para lectura y entretenimiento -->
        <a-light type="ambient" color="#fceee9" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.6" position="2 5 3"></a-light>

        <!-- Cielo exterior de la sala -->
        <a-sky color="#1c1614"></a-sky>

        <!-- Piso general de la tienda -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="16" height="16" color="#3d2f26"></a-plane>

        <!-- PAREDES DEL ESTABLECIMIENTO -->
        <!-- Pared Izquierda (Zona de Libros) -->
        <a-plane position="-8 3 0" rotation="0 90 0" width="16" height="6" color="#4a3b32"></a-plane>
        <!-- Pared Derecha (Zona de Series) -->
        <a-plane position="8 3 0" rotation="0 -90 0" width="16" height="6" color="#2b201a"></a-plane>
        <!-- Pared de Fondo -->
        <a-plane position="0 3 -8" width="16" height="6" color="#382a21"></a-plane>

        <!-- ================= SECCIÓN 1: LIBRERÍA (Lado Izquierdo) ================= -->
        <!-- Estantería de Libros 1 -->
        <a-box position="-7.8 1.5 -3" width="0.4" height="3" depth="2" color="#261c14"></a-box>
        <!-- Muestras de portadas de libros en la pared izquierda -->
        <a-box position="-7.86 2.2 -1" rotation="0 90 0" width="1.2" height="1.6" depth="0.04" color="#d4af37"></a-box>
        <a-plane position="-7.82 2.2 -1" rotation="0 90 0" width="1.0" height="1.4" color="#f7f1e8"></a-plane>

        <a-box position="-7.86 2.2 1" rotation="0 90 0" width="1.2" height="1.6" depth="0.04" color="#d4af37"></a-box>
        <a-plane position="-7.82 2.2 1" rotation="0 90 0" width="1.0" height="1.4" color="#f7f1e8"></a-plane>


        <!-- ================= SECCIÓN 2: SALA DE SERIES / STREAMING (Lado Derecho) ================= -->
        <!-- Pantalla Gigante de Cine / Streaming (Frente a la zona derecha) -->
        <a-box position="0 3 -7.9" width="7.2" height="4.2" depth="0.1" color="#14100e"></a-box>
        <a-plane position="0 3 -7.84" width="6.8" height="3.8" color="#080706"></a-plane>
        
        <!-- Texto decorativo o simulación de reproductor en pantalla (Marquesina visual) -->
        <a-box position="0 1.2 -7.8" width="4" height="0.6" depth="0.05" color="#5c4435"></a-box>

        <!-- Asientos cómodos para ver las series -->
        <!-- Sofá Central 1 -->
        <a-box position="0 0.4 -2" width="3" height="0.5" depth="1" color="#523d30"></a-box>
        <a-box position="0 0.9 -2.4" width="3" height="0.8" depth="0.2" color="#523d30"></a-box>

        <!-- Sofá Fila Trás -->
        <a-box position="0 0.4 1" width="3" height="0.5" depth="1" color="#423126"></a-box>
        <a-box position="0 0.9 0.6" width="3" height="0.8" depth="0.2" color="#423126"></a-box>


        <!-- Cámara de recorrido libre -->
        <a-entity id="camera" camera look-controls wasd-controls position="0 1.6 6">
            <a-cursor color="#ead7c0"></a-cursor>
        </a-entity>
    </a-scene>

</body>
</html>
