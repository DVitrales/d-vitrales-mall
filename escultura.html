<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Escultura 3D - D'Vitrales Mall</title>
    <!-- Librería A-Frame para Realidad Virtual -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .boton-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(63, 48, 37, 0.85);
            color: #f7f1e8;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #ead7c0;
        }
    </style>
</head>
<body>

    <!-- Botón para regresar al index -->
    <a href="index.html" class="boton-volver">⬅ Volver al Centro Comercial</a>

    <!-- Escenario 3D para Esculturas -->
    <a-scene>
        <!-- Iluminación museográfica cálida para resaltar volúmenes -->
        <a-light type="ambient" color="#fceee9" intensity="0.7"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.6" position="2 5 2"></a-light>

        <!-- Cielo del entorno -->
        <a-sky color="#241d1a"></a-sky>

        <!-- Piso de la Galería -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="14" height="14" color="#d9c4b0"></a-plane>

        <!-- Paredes del Salón de Esculturas -->
        <a-plane position="0 3 -7" width="14" height="6" color="#f4ede2"></a-plane>
        <a-plane position="-7 3 0" rotation="0 90 0" width="14" height="6" color="#ebdccb"></a-plane>
        <a-plane position="7 3 0" rotation="0 -90 0" width="14" height="6" color="#ebdccb"></a-plane>
        <a-plane position="0 3 7" rotation="0 180 0" width="14" height="6" color="#f4ede2"></a-plane>

        <!-- PEDESTAL CENTRAL (Para escultura principal o de gran formato) -->
        <a-box position="0 0.7 0" width="1.8" height="1.4" depth="1.8" color="#3f3025"></a-box>
        <a-box position="0 1.42 0" width="2" height="0.04" depth="2" color="#5c4435"></a-box>

        <!-- PEDESTAL LATERAL IZQUIERDO -->
        <a-box position="-4 0.5 -2" width="1.2" height="1.0" depth="1.2" color="#4a382b"></a-box>
        <a-box position="-4 1.02 -2" width="1.3" height="0.04" depth="1.3" color="#5c4435"></a-box>

        <!-- PEDESTAL LATERAL DERECHO -->
        <a-box position="4 0.5 -2" width="1.2" height="1.0" depth="1.2" color="#4a382b"></a-box>
        <a-box position="4 1.02 -2" width="1.3" height="0.04" depth="1.3" color="#5c4435"></a-box>

        <!-- BANCA DE DESCANSO PARA VISITANTES -->
        <a-box position="0 0.4 4" width="3" height="0.4" depth="0.8" color="#3f3025"></a-box>
        <a-box position="-1.2 0.2 4" width="0.2" height="0.4" depth="0.7" color="#241d1a"></a-box>
        <a-box position="1.2 0.2 4" width="0.2" height="0.4" depth="0.7" color="#241d1a"></a-box>

        <!-- Cámara de recorrido libre -->
        <a-entity id="camera" camera look-controls wasd-controls position="0 1.6 6">
            <a-cursor color="#ead7c0"></a-cursor>
        </a-entity>
    </a-scene>

</body>
</html>
