<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Música y Videoclips - D'Vitrales Mall</title>
    <!-- Librería A-Frame para Realidad Virtual -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .boton-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(43, 31, 24, 0.85);
            color: #f7f1e8;
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #d4af37;
            font-size: 14px;
        }
        .boton-carrito {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 999;
            background: #d4af37;
            color: #21150e;
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 14px;
        }
        /* Ventana Modal / Emergente de Información Musical */
        #modal-producto {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            max-height: 85vh;
            overflow-y: auto;
            background: #f7f1e8;
            color: #21150e;
            padding: 20px;
            border-radius: 12px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-family: Arial, sans-serif;
            border: 2px solid #d4af37;
        }
        #modal-producto h3 { margin-top: 0; color: #4a2e1b; border-bottom: 1px solid #d4af37; padding-bottom: 5px; }
        .seccion-info { font-size: 13px; margin: 8px 0; line-height: 1.4; }
        .btn-accion {
            background: #5c3a21;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .btn-cerrar {
            background: #a94442;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Botones de navegación superior -->
    <a href="index.html" class="boton-volver">⬅ Volver al Mall</a>
    <button class="boton-carrito" onclick="verCarrito()">🛒 Carrito (<span id="contador-carrito">0</span>)</button>

    <!-- VENTANA EMERGENTE (MODAL) PARA VIDEOCLIP Y MÚSICA -->
    <div id="modal-producto">
        <h3 id="modal-titulo">Título del Audiovisual</h3>
        <p class="seccion-info"><strong>Artista / Proyecto:</strong> <span id="modal-artista">Nombre del Creador</span></p>
        <p class="seccion-info"><strong>Concepto y Producción:</strong> <span id="modal-bio">Detalles del tema musical y producción audiovisual.</span></p>
        <p class="seccion-info"><strong>Formato:</strong> <span id="modal-material">Videoclip en alta definición y pista de audio digital.</span></p>
        <p class="seccion-info"><strong>Precio / Acceso:</strong> <span id="modal-precio" style="color: #8b5a2b; font-weight: bold;">$0.00</span></p>
        <button class="btn-accion" onclick="agregarAlCarritoFromModal()">Adquirir / Descargar 🎵</button>
        <button class="btn-accion btn-cerrar" onclick="cerrarModal()">Cerrar</button>
    </div>

    <!-- Escenario 3D de Música y Videoclips -->
    <a-scene>
        <!-- Iluminación moderna con matices creativos para estudio -->
        <a-light type="ambient" color="#f2e6ff" intensity="0.7"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.6" position="0 6 3"></a-light>
        <a-light type="point" color="#e0c3fc" intensity="0.5" position="0 4 -2"></a-light>

        <!-- Cielo exterior -->
        <a-sky color="#141017"></a-sky>

        <!-- Piso acústico oscuro y elegante -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="16" height="16" color="#241b2b"></a-plane>

        <!-- PAREDES DE LA TIENDA DE MÚSICA -->
        <a-plane position="0 3 -8" width="16" height="6" color="#362942"></a-plane>
        <a-plane position="-8 3 0" rotation="0 90 0" width="16" height="6" color="#2b1f36"></a-plane>
        <a-plane position="8 3 0" rotation="0 -90 0" width="16" height="6" color="#2b1f36"></a-plane>

        <!-- ================= MOBILIARIO DECORATIVO DEL ESTUDIO ================= -->
        <!-- Zona de asientos para escuchar y disfrutar de las pantallas -->
        <a-box position="0 0.4 -2" width="3.2" height="0.5" depth="1" color="#4a355c"></a-box>
        <a-box position="0 0.9 -2.4" width="3.2" height="0.8" depth="0.2" color="#4a355c"></a-box>

        <!-- ================= PANTALLA PRINCIPAL DE VIDEOCLIPS (INTERACTIVA) ================= -->
        <a-entity position="0 0 0" onclick="mostrarDetalle('Luz Interior (Videoclip Oficial)', 'D'Vitrales Studio', 'Producción audiovisual horizontal que combina arreglos vocales originales, composición digital en capas y arte visual emotivo.', 'Video HD / Formato digital musical optimizado.', 15.00)">
            <!-- Marco de la pantalla gigante -->
            <a-box position="0 3 -7.9" width="8.2" height="4.4" depth="0.1" color="#120d17"></a-box>
            <!-- Panel de visualización de video -->
            <a-plane position="0 3 -7.83" width="7.8" height="4.0" color="#050308"></a-plane>
            <!-- Barra de anuncio publicitario o título inferior interactivo -->
            <a-box position="0 0.8 -7.8" width="4.5" height="0.6" depth="0.05" color="#9b5de5"></a-box>
        </a-entity>

        <!-- ================= ESTANTE IZQUIERDO DE ÁLBUMES ================= -->
        <a-entity position="0 0 0" onclick="mostrarDetalle('Sencillos y Acústicos Vol. 1', 'D'Vitrales', 'Recopilación de temas sonoros independientes creados con sintetizadores y herramientas digitales.', 'Álbum digital completo con arte de portada exclusivo.', 12.00)">
            <a-box position="-7 1.5 -2" width="0.4" height="3" depth="2.5" color="#1c1424"></a-box>
            <a-box position="-7.82 2.2 -2" rotation="0 90 0" width="1.2" height="1.2" depth="0.04" color="#f15bb5"></a-box>
        </a-entity>

        <!-- ================= ESTANTE DERECHO DE ÁLBUMES ================= -->
        <a-entity position="0 0 0" onclick="mostrarDetalle('Paisajes Sonoros & Voces', 'Vances Studio', 'Exploración de melodías envolventes diseñadas para acompañar momentos de creación artística.', 'Pistas de audio en máxima calidad de estudio.', 12.00)">
            <a-box position="7 1.5 -2" width="0.4" height="3" depth="2.5" color="#1c1424"></a-box>
            <a-box position="7.82 2.2 -2" rotation="0 -90 0" width="1.2" height="1.2" depth="0.04" color="#00bbf9"></a-box>
        </a-entity>

        <!-- Cámara de recorrido libre -->
        <a-entity id="camera" camera look-controls wasd-controls position="0 1.6 6">
            <a-cursor color="#ead7c0"></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        let itemActual = "";
        let precioActual = 0;
        let carrito = [];

        function mostrarDetalle(titulo, artista, bio, material, precio) {
            itemActual = titulo;
            precioActual = precio;
            document.getElementById('modal-titulo').innerText = titulo;
            document.getElementById('modal-artista').innerText = artista;
            document.getElementById('modal-bio').innerText = bio;
            document.getElementById('modal-material').innerText = material;
            document.getElementById('modal-precio').innerText = "$" + precio.toFixed(2);
            document.getElementById('modal-producto').style.display = 'block';
        }

        function cerrarModal() {
            document.getElementById('modal-producto').style.display = 'none';
        }

        function agregarAlCarritoFromModal() {
            carrito.push({ nombre: itemActual, precio: precioActual });
            document.getElementById('contador-carrito').innerText = carrito.length;
            alert("¡ \"" + itemActual + "\" se ha añadido al carrito de compras musical!");
            cerrarModal();
        }

        function verCarrito() {
            if (carrito.length === 0) {
                alert("Tu carrito de compras en esta tienda de música está vacío.");
            } else {
                let resumen = "Artículos en tu carrito musical:\n";
                let total = 0;
                carrito.forEach((item, index) => {
                    resumen += (index + 1) + ". " + item.nombre + " - $" + item.precio.toFixed(2) + "\n";
                    total += item.precio;
                });
                resumen += "\nTotal de la selección: $" + total.toFixed(2);
                alert(resumen);
            }
        }
    </script>

</body>
</html>
