<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Pintura 3D - D'Vitrales Mall</title>
    <!-- Librería A-Frame para Realidad Virtual en 3D -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .boton-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(63, 48, 37, 0.85);
            color: #f7f1e8;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #ead7c0;
        }
    </style>
</head>
<body>

    <!-- Botón para regresar al index sin perderse -->
    <a href="index.html" class="boton-volver">⬅ Volver al Centro Comercial</a>

    <!-- Escenario 3D Inmersivo -->
    <a-scene>
        <!-- Luces del espacio -->
        <a-light type="ambient" color="#fff5ea" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.5" position="-1 4 1"></a-light>

        <!-- Cielo / Ambiente exterior -->
        <a-sky color="#2c221e"></a-sky>

        <!-- Piso de la Galería -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#e8d5c1"></a-plane>

        <!-- Pared Frontal -->
        <a-plane position="0 2.5 -6" width="12" height="5" color="#f7f1e8"></a-plane>
        
        <!-- Pared Izquierda -->
        <a-plane position="-6 2.5 0" rotation="0 90 0" width="12" height="5" color="#f1e5d4"></a-plane>

        <!-- Pared Derecha -->
        <a-plane position="6 2.5 0" rotation="0 -90 0" width="12" height="5" color="#f1e5d4"></a-plane>

        <!-- Pared Trasera -->
        <a-plane position="0 2.5 6" rotation="0 180 0" width="12" height="5" color="#f7f1e8"></a-plane>

        <!-- Marco 1 (Pared Frontal - Centro) -->
        <a-box position="0 2.5 -5.9" width="3.2" height="2.2" depth="0.05" color="#3f3025"></a-box>
        <a-plane position="0 2.5 -5.86" width="3" height="2" color="#ffffff"></a-plane>

        <!-- Marco 2 (Pared Izquierda) -->
        <a-box position="-5.9 2.5 -2" rotation="0 90 0" width="2.7" height="2.0" depth="0.05" color="#3f3025"></a-box>
        <a-plane position="-5.86 2.5 -2" rotation="0 90 0" width="2.5" height="1.8" color="#ffffff"></a-plane>

        <!-- Marco 3 (Pared Derecha) -->
        <a-box position="5.9 2.5 -2" rotation="0 -90 0" width="2.7" height="2.0" depth="0.05" color="#3f3025"></a-box>
        <a-plane position="5.86 2.5 -2" rotation="0 -90 0" width="2.5" height="1.8" color="#ffffff"></a-plane>

        <!-- Cámara / Visor de la persona -->
        <a-entity id="camera" camera look-controls wasd-controls position="0 1.6 2">
            <a-cursor color="#ead7c0"></a-cursor>
        </a-entity>
    </a-scene>

</body>
</html>
