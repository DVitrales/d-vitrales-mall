<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>D'Vitrales Mall — Lobby 3D</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff5dc;
      touch-action: none;
    }

    #scene-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Teclitas holográficas sin marcos ni bordes */
    .holo-top-right {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
    }

    .holo-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 14px;
      pointer-events: auto;
    }

    .holo-key {
      background: transparent;
      border: none;
      outline: none;
      padding: 2px 4px;
      color: #fff2cc;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(255, 214, 115, 0.75), 0 1px 4px rgba(0, 0, 0, 0.95);
      transition: transform 0.16s ease, color 0.16s ease, text-shadow 0.16s ease;
    }

    .holo-key:hover,
    .holo-key.active {
      color: #7ef9ff;
      transform: translateY(-1px);
      text-shadow: 0 0 14px rgba(126, 249, 255, 0.9), 0 1px 6px rgba(0, 0, 0, 0.95);
    }

    /* Despliegue flotante sin marcos ni bordes */
    .holo-drawer {
      position: fixed;
      top: 66px;
      right: 16px;
      z-index: 25;
      max-width: min(92vw, 460px);
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: auto;
    }

    .holo-drawer.open {
      display: flex;
    }

    .holo-greeting {
      text-align: right;
      font-size: 13px;
      line-height: 1.4;
      color: #fff6dc;
      text-shadow: 0 0 12px rgba(126, 249, 255, 0.45), 0 1px 6px rgba(0, 0, 0, 0.95);
    }

    .holo-spaces-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, auto));
      gap: 7px 18px;
      justify-items: end;
    }

    .holo-space-btn {
      background: transparent;
      border: none;
      outline: none;
      padding: 2px 0;
      text-align: right;
      font-size: 12.5px;
      font-weight: 500;
      color: #ffe9ad;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(255, 204, 92, 0.6), 0 1px 5px rgba(0, 0, 0, 0.98);
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .holo-space-btn:hover {
      color: #7ef9ff;
      transform: translateX(-2px);
      text-shadow: 0 0 14px rgba(126, 249, 255, 0.95), 0 1px 6px rgba(0, 0, 0, 0.98);
    }

    /* Anfitriona bilingüe en pantalla completa */
    #hostess-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      background: radial-gradient(circle at 25% 45%, rgba(16, 68, 78, 0.55), rgba(5, 9, 15, 0.86));
    }

    #hostess-overlay.active {
      display: flex;
    }

    #hostess-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      display: none;
    }

    .hostess-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .hostess-center {
      max-width: 540px;
      margin: auto 0 auto 4%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hostess-title {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 700;
      color: #ffe8a3;
      text-shadow: 0 0 16px rgba(255, 212, 102, 0.7), 0 2px 8px rgba(0, 0, 0, 0.95);
    }

    .hostess-sub {
      font-size: 14.5px;
      line-height: 1.5;
      color: #e9fcff;
      text-shadow: 0 0 10px rgba(126, 249, 255, 0.45), 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .hostess-quick-spaces {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, max-content));
      gap: 6px 22px;
      margin-top: 8px;
    }

    /* Etiqueta discreta del local enfocado */
    #focused-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 18;
      font-size: 13px;
      font-weight: 600;
      color: #ffe8a3;
      text-shadow: 0 0 10px rgba(255, 208, 102, 0.7), 0 1px 5px rgba(0, 0, 0, 0.95);
      pointer-events: none;
    }

    /* Barra inferior de desplazamiento y zoom */
    .bottom-bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(96vw, 820px);
      padding: 6px 10px;
      pointer-events: auto;
    }

    .nav-btn {
      background: rgba(10, 16, 24, 0.42);
      border: 1px solid rgba(255, 218, 122, 0.28);
      border-radius: 999px;
      color: #fff2cc;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255, 208, 102, 0.22);
      border-color: rgba(126, 249, 255, 0.75);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .zoom-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <div id="focused-badge">Lobby Central — D'Vitrales Mall</div>

  <!-- Teclitas holográficas sin marcos ni bordes -->
  <div class="holo-top-right">
    <div class="holo-row">
      <button id="btn-lang-es" class="holo-key" type="button">ES</button>
      <button id="btn-lang-en" class="holo-key" type="button">EN</button>
      <button id="btn-guide" class="holo-key" type="button">Guía</button>
      <button id="btn-spaces" class="holo-key" type="button">Locales</button>
    </div>
  </div>

  <!-- Menú desplegable transparente sin bordes -->
  <div id="holo-drawer" class="holo-drawer">
    <div id="holo-greeting" class="holo-greeting">
      Selecciona un local para acercarte y hacer zoom.
    </div>
    <div id="holo-spaces-grid" class="holo-spaces-grid"></div>
  </div>

  <!-- Anfitriona bilingüe en pantalla completa -->
  <div id="hostess-overlay">
    <video id="hostess-video" playsinline autoplay loop muted></video>
    <div class="hostess-top">
      <div class="holo-row">
        <button id="hostess-es" class="holo-key" type="button">ES</button>
        <button id="hostess-en" class="holo-key" type="button">EN</button>
      </div>
      <button id="hostess-enter" class="holo-key" type="button">Recorrer Lobby ↗</button>
    </div>

    <div class="hostess-center">
      <div id="hostess-title" class="hostess-title">Bienvenida a D'Vitrales Mall</div>
      <div id="hostess-sub" class="hostess-sub">
        Recorre el lobby libremente o toca cualquiera de nuestros 10 espacios para viajar y hacer zoom.
      </div>
      <div id="hostess-spaces" class="hostess-quick-spaces"></div>
    </div>

    <div></div>
  </div>

  <!-- Barra inferior con regreso automático al centro frente al letrero -->
  <div class="bottom-bar">
    <button id="btn-center-sign" class="nav-btn active" type="button">Centro / Letrero</button>
    <button class="nav-btn waypoint-btn" data-wp="west" type="button">Ala Oeste</button>
    <button class="nav-btn waypoint-btn" data-wp="east" type="button">Ala Este</button>
    <button class="nav-btn waypoint-btn" data-wp="level2" type="button">Nivel 2</button>
    <div class="zoom-group">
      <button id="zoom-out" class="nav-btn" type="button">-</button>
      <button id="zoom-reset" class="nav-btn" type="button">1x</button>
      <button id="zoom-in" class="nav-btn" type="button">+</button>
    </div>
  </div>

  <script type="module">

    const ENTRANCE_POS = new THREE.Vector3(0, 2.2, 16.5);
    const SIGN_LOOK_TARGET = new THREE.Vector3(0, 2.5, -13.5);
