<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>D'Vitrales Mall — Lobby 3D</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #162638 0%, #090e16 70%, #05080d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff5dc;
      touch-action: none;
    }

    #scene-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Respaldo visual si el 3D no alcanza a cargar en algún equipo */
    #fallback-lobby {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 25%, rgba(255, 204, 92, 0.22), transparent 45%),
        radial-gradient(circle at 50% 70%, rgba(26, 120, 130, 0.22), transparent 55%),
        linear-gradient(180deg, #0b131e 0%, #070b10 100%);
    }

    .fallback-sign {
      font-family: Georgia, serif;
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 700;
      letter-spacing: 0.03em;
      background: linear-gradient(180deg, #fff1ba 0%, #e4b14b 55%, #9c6c18 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 6px 24px rgba(229, 178, 76, 0.28);
      margin-bottom: 10px;
    }

    .fallback-note {
      font-size: 13px;
      color: rgba(255, 242, 204, 0.8);
      max-width: 420px;
    }

    /* Etiqueta superior izquierda sin invadir la derecha */
    #focused-badge {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      max-width: 42vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      font-weight: 600;
      color: #ffe8a3;
      text-shadow: 0 0 10px rgba(255, 208, 102, 0.7), 0 1px 5px rgba(0, 0, 0, 0.98);
      pointer-events: none;
    }

    /* Teclitas holográficas sin marcos ni bordes */
    .holo-top-right {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 22;
      max-width: 54vw;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
    }

    .holo-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      pointer-events: auto;
    }

    .holo-key {
      background: transparent;
      border: none;
      outline: none;
      padding: 2px 3px;
      color: #fff2cc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(255, 214, 115, 0.8), 0 1px 4px rgba(0, 0, 0, 0.98);
      transition: transform 0.16s ease, color 0.16s ease, text-shadow 0.16s ease;
    }

    .holo-key:hover,
    .holo-key.active {
      color: #7ef9ff;
      transform: translateY(-1px);
      text-shadow: 0 0 14px rgba(126, 249, 255, 0.95), 0 1px 6px rgba(0, 0, 0, 0.98);
    }

    /* Despliegue flotante sin marcos ni bordes */
    .holo-drawer {
      position: fixed;
      top: 52px;
      right: 14px;
      z-index: 25;
      max-width: min(92vw, 440px);
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: auto;
    }

    .holo-drawer.open {
      display: flex;
    }

    .holo-greeting {
      text-align: right;
      font-size: 12.5px;
      line-height: 1.4;
      color: #fff6dc;
      text-shadow: 0 0 12px rgba(126, 249, 255, 0.45), 0 1px 6px rgba(0, 0, 0, 0.98);
    }

    .holo-spaces-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, auto));
      gap: 7px 16px;
      justify-items: end;
    }

    .holo-space-btn {
      background: transparent;
      border: none;
      outline: none;
      padding: 2px 0;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: #ffe9ad;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(255, 204, 92, 0.65), 0 1px 5px rgba(0, 0, 0, 0.98);
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .holo-space-btn:hover {
      color: #7ef9ff;
      transform: translateX(-2px);
      text-shadow: 0 0 14px rgba(126, 249, 255, 0.95), 0 1px 6px rgba(0, 0, 0, 0.98);
    }

    /* Anfitriona bilingüe en pantalla completa con audio */
    #hostess-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 30;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      background: radial-gradient(circle at 25% 45%, rgba(16, 68, 78, 0.48), rgba(5, 9, 15, 0.82));
    }

    #hostess-overlay.active {
      display: flex;
    }

    #hostess-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      display: none;
      background: #05090f;
    }

    .hostess-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hostess-center {
      max-width: 520px;
      margin: auto 0 auto 3%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hostess-title {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 700;
      color: #ffe8a3;
      text-shadow: 0 0 16px rgba(255, 212, 102, 0.75), 0 2px 8px rgba(0, 0, 0, 0.98);
    }

    .hostess-sub {
      font-size: 14px;
      line-height: 1.5;
      color: #e9fcff;
      text-shadow: 0 0 10px rgba(126, 249, 255, 0.5), 0 2px 6px rgba(0, 0, 0, 0.98);
    }

    .hostess-quick-spaces {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, max-content));
      gap: 6px 20px;
      margin-top: 8px;
    }

    /* Barra inferior con regreso automático al centro frente al letrero */
    .bottom-bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 22;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: min(96vw, 820px);
      padding: 6px 10px;
      pointer-events: auto;
    }

    .nav-btn {
      background: rgba(10, 16, 24, 0.52);
      border: 1px solid rgba(255, 218, 122, 0.3);
      border-radius: 999px;
      color: #fff2cc;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255, 208, 102, 0.24);
      border-color: rgba(126, 249, 255, 0.8);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .zoom-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div id="fallback-lobby">
    <div class="fallback-sign">D'Vitrales Mall</div>
    <div class="fallback-note">Explora los 10 espacios del lobby o selecciona ES / EN para ver a la anfitriona.</div>
  </div>

  <canvas id="scene-canvas"></canvas>

  <div id="focused-badge">Lobby Central</div>

  <!-- Teclitas holográficas sin marcos ni bordes -->
  <div class="holo-top-right">
    <div class="holo-row">
      <button id="btn-lang-es" class="holo-key" type="button">ES</button>
      <button id="btn-lang-en" class="holo-key" type="button">EN</button>
      <button id="btn-guide" class="holo-key" type="button">Guía</button>
      <button id="btn-spaces" class="holo-key" type="button">Locales</button>
    </div>
  </div>

  <!-- Menú desplegable transparente sin bordes -->
  <div id="holo-drawer" class="holo-drawer">
    <div id="holo-greeting" class="holo-greeting">
      Elige un espacio para viajar y hacer zoom hacia su fachada:
    </div>
    <div id="holo-spaces-grid" class="holo-spaces-grid"></div>

  <!-- Anfitriona bilingüe en pantalla completa con audio -->
  <div id="hostess-overlay">
    <video id="hostess-video" playsinline webkit-playsinline autoplay></video>
    <div class="hostess-top">

      <button id="hostess-enter" class="holo-key" type="button">Recorrer Lobby ↗</button>

    <div class="hostess-center">
      <div id="hostess-title" class="hostess-title">Bienvenida a D'Vitrales Mall</div>
      <div id="hostess-sub" class="hostess-sub">

      </div>
      <div id="hostess-spaces" class="hostess-quick-spaces"></div>
    </div>

    <div></div>
  </div>

  <!-- Barra inferior con regreso automático al centro frente al letrero -->
  <div class="bottom-bar">
    <button id="btn-center-sign" class="nav-btn active" type="button">Centro / Letrero</button>
    <button class="nav-btn waypoint-btn" data-wp="west" type="button">Ala Oeste</button>

    <button class="nav-btn waypoint-btn" data-wp="level2" type="button">Nivel 2</button>
    <div class="zoom-group">
      <button id="zoom-out" class="nav-btn" type="button">-</button>
      <button id="zoom-reset" class="nav-btn" type="button">1x</button>
      <button id="zoom-in" class="nav-btn" type="button">+</button>
    </div>
  </div>
