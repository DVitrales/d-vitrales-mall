<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>D'Vitrales Mall — Lobby 3D</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #162638 0%, #090e16 70%, #05080d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff5dc;
    }

    #scene-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 1;
      touch-action: none;
    }

    #scene-canvas.ready {
      display: block;
    }

    #fallback-lobby {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 25%, rgba(255, 204, 92, 0.24), transparent 45%),
        radial-gradient(circle at 50% 70%, rgba(26, 120, 130, 0.24), transparent 55%),
        linear-gradient(180deg, #0b131e 0%, #070b10 100%);
    }

    .fallback-sign {
      font-family: Georgia, serif;
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 700;
      letter-spacing: 0.03em;
      background: linear-gradient(180deg, #fff1ba 0%, #e4b14b 55%, #9c6c18 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .fallback-note {
      font-size: 13px;
      color: rgba(255, 242, 204, 0.85);
      max-width: 440px;
      line-height: 1.45;
    }

    #focused-badge {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 40;
      max-width: 42vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      font-weight: 600;
      color: #ffe8a3;
      text-shadow: 0 0 10px rgba(255, 208, 102, 0.75), 0 1px 5px rgba(0, 0, 0, 0.98);
      pointer-events: none;
    }

    .holo-top-right {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 45;
      max-width: 54vw;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
    }

    .holo-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      pointer-events: auto;
    }

    .holo-key {
      background: transparent;
      border: none;
      outline: none;
      padding: 4px 4px;
      color: #fff2cc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(255, 214, 115, 0.8), 0 1px 4px rgba(0, 0, 0, 0.98);
      transition: transform 0.16s ease, color 0.16s ease;
    }

    .holo-key:hover,
    .holo-key.active {
      color: #7ef9ff;
      transform: translateY(-1px);
      text-shadow: 0 0 14px rgba(126, 249, 255, 0.95), 0 1px 6px rgba(0, 0, 0, 0.98);
    }

    .holo-drawer {
      position: fixed;
      top: 52px;
      right: 14px;
      z-index: 50;
      max-width: min(92vw, 440px);
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: auto;
    }

    .holo-drawer.open {
      display: flex;
    }

    .holo-greeting {
      text-align: right;
      font-size: 12.5px;
      line-height: 1.4;
      color: #fff6dc;
      text-shadow: 0 0 12px rgba(126, 249, 255, 0.45), 0 1px 6px rgba(0, 0, 0, 0.98);
    }

    .holo-spaces-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, auto));
      gap: 7px 16px;
      justify-items: end;
    }

    .holo-space-btn {
      background: transparent;
      border: none;
      outline: none;
      padding: 2px 0;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: #ffe9ad;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(255, 204, 92, 0.65), 0 1px 5px rgba(0, 0, 0, 0.98);
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .holo-space-btn:hover {
      color: #7ef9ff;
      transform: translateX(-2px);
      text-shadow: 0 0 14px rgba(126, 249, 255, 0.95), 0 1px 6px rgba(0, 0, 0, 0.98);
    }

    #hostess-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 60;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      background: linear-gradient(
        180deg,
        rgba(5, 9, 15, 0.58) 0%,
        rgba(5, 9, 15, 0.08) 26%,
        rgba(5, 9, 15, 0.10) 58%,
        rgba(5, 9, 15, 0.86) 100%
      );
    }

    #hostess-overlay.active {
      display: flex;
    }

    #hostess-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center 20%;
      z-index: -1;
      display: none;
      background: #05090f;
    }

    .hostess-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hostess-bottom-panel {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      padding-bottom: 6px;
    }

    .hostess-title {
      font-size: clamp(20px, 3.8vw, 30px);
      font-weight: 700;
      color: #ffe8a3;
      text-shadow: 0 0 16px rgba(255, 212, 102, 0.75), 0 2px 8px rgba(0, 0, 0, 0.98);
    }

    .hostess-sub {
      font-size: 13px;
      line-height: 1.45;
      color: #e9fcff;
      text-shadow: 0 0 10px rgba(126, 249, 255, 0.5), 0 2px 6px rgba(0, 0, 0, 0.98);
    }

    .hostess-quick-spaces {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 14px;
      width: 100%;
      margin-top: 4px;
    }

    .hostess-quick-spaces .holo-space-btn {
      text-align: center;
      font-size: 11.5px;
    }

    .bottom-bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 45;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: min(96vw, 820px);
      padding: 6px 10px;
      pointer-events: auto;
    }

    .nav-btn {
      background: rgba(10, 16, 24, 0.58);
      border: 1px solid rgba(255, 218, 122, 0.32);
      border-radius: 999px;
      color: #fff2cc;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255, 208, 102, 0.24);
      border-color: rgba(126, 249, 255, 0.8);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .zoom-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div id="fallback-lobby">
    <div class="fallback-sign">D'Vitrales Mall</div>
    <div id="fallback-sub" class="fallback-note">Explora los 10 espacios del lobby o selecciona ES / EN para ver a la anfitriona.</div>
  </div>

  <canvas id="scene-canvas"></canvas>

  <div id="focused-badge">Lobby Central</div>

  <div class="holo-top-right">
    <div class="holo-row">
      <button id="btn-lang-es" class="holo-key" type="button">ES</button>
      <button id="btn-lang-en" class="holo-key" type="button">EN</button>
      <button id="btn-guide" class="holo-key" type="button">Guía</button>
      <button id="btn-spaces" class="holo-key" type="button">Locales</button>
    </div>
  </div>

  <div id="holo-drawer" class="holo-drawer">
    <div id="holo-greeting" class="holo-greeting">Elige un espacio:</div>
    <div id="holo-spaces-grid" class="holo-spaces-grid"></div>
  </div>

  <div id="hostess-overlay">
    <video id="hostess-video" playsinline webkit-playsinline autoplay loop></video>
    <div class="hostess-top">
      <div class="holo-row">
        <button id="hostess-es" class="holo-key" type="button">ES</button>
        <button id="hostess-en" class="holo-key" type="button">EN</button>
        <button id="hostess-audio" class="holo-key" type="button">Audio ON</button>
      </div>
      <button id="hostess-enter" class="holo-key" type="button">Recorrer Lobby ↗</button>
    </div>

    <div class="hostess-bottom-panel">
      <div id="hostess-title" class="hostess-title">Bienvenida a D'Vitrales Mall</div>
      <div id="hostess-sub" class="hostess-sub">
        Explora el lobby o elige cualquiera de los 10 locales.
      </div>
      <div id="hostess-spaces" class="hostess-quick-spaces"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <button id="btn-center-sign" class="nav-btn active" type="button">Centro / Letrero</button>
    <button class="nav-btn waypoint-btn" data-wp="west" type="button">Ala Oeste</button>
    <button class="nav-btn waypoint-btn" data-wp="east" type="button">Ala Este</button>
    <button class="nav-btn waypoint-btn" data-wp="level2" type="button">Nivel 2</button>
    <div class="zoom-group">
      <button id="zoom-out" class="nav-btn" type="button">-</button>
      <button id="zoom-reset" class="nav-btn" type="button">1x</button>
      <button id="zoom-in" class="nav-btn" type="button">+</button>
    </div>
  </div>

  <script>
    const HOSTESS_MEDIA = {
      es: { video: "anfitrionamp4.mp4" },
      en: { video: "anfitriona-en.mp4" }
    };

    const SPACES = [
      { id: "chocolatier", level: 1, angle: -2.35, es: "Chocolatier Gallery", en: "Chocolatier Gallery" },
      { id: "boutique", level: 1, angle: -1.72, es: "Boutique", en: "Boutique" },
      { id: "runway", level: 1, angle: -1.10, es: "Salón Pasarela de Boutique", en: "Boutique Runway Salon" },
      { id: "painting", level: 1, angle: 1.10, es: "Galería de Pintura", en: "Painting Gallery" },
      { id: "sculpture", level: 1, angle: 1.72, es: "Galería de Escultura", en: "Sculpture Gallery" },
      { id: "decor", level: 2, angle: -2.25, es: "Tienda Decoración para el Hogar", en: "Home Decor Store" },
      { id: "books", level: 2, angle: -1.57, es: "Tienda de Libros y Series", en: "Books & Series Store" },
      { id: "music", level: 2, angle: -0.88, es: "Tienda de Música", en: "Music Store" },
      { id: "school", level: 2, angle: 1.15, es: "Escuela de Pintura", en: "Painting School" },
      { id: "supplies", level: 2, angle: 1.85, es: "Tienda de Materiales para Arte", en: "Art Supplies Store" }
    ];

    const UI_TEXT = {
      es: {
        guide: "Guía",
        spaces: "Locales",
        centerBtn: "Centro / Letrero",
        enterLobby: "Recorrer Lobby ↗",
        audioOn: "Audio ON",
        audioOff: "Audio OFF",
        lobbyTitle: "Lobby Central",
        hostessTitle: "Bienvenida a D'Vitrales Mall",
        hostessSub: "Explora el lobby o elige cualquiera de los 10 locales.",
        drawerHint: "Elige un espacio:",
        fallbackSub: "Explora los 10 espacios del lobby o selecciona ES / EN para ver a la anfitriona."
      },
      en: {
        guide: "Guide",
        spaces: "Spaces",
        centerBtn: "Center / Sign",
        enterLobby: "Explore Lobby ↗",
        audioOn: "Audio ON",
        audioOff: "Audio OFF",
        lobbyTitle: "Central Lobby",
        hostessTitle: "Welcome to D'Vitrales Mall",
        hostessSub: "Explore the lobby or pick any of the 10 spaces.",
        drawerHint: "Pick a space:",
        fallbackSub: "Explore the 10 lobby spaces or select ES / EN to see the host."
      }
    };

    let lang = "es";
    let activeSpace = null;
    window.__lobbyBridge = {
      focusSpace: null,
      waypoint: null,
      zoom: null,
      updateLang: null
    };

    const drawer = document.getElementById("holo-drawer");
    const hostessOverlay = document.getElementById("hostess-overlay");
    const hostessVideo = document.getElementById("hostess-video");
    const audioBtn = document.getElementById("hostess-audio");

    function updateBadge(text) {
      document.getElementById("focused-badge").textContent = text;
    }

    function updateAudioLabel() {
      const t = UI_TEXT[lang];
      audioBtn.textContent = hostessVideo.muted ? t.audioOff : t.audioOn;
      audioBtn.classList.toggle("active", !hostessVideo.muted);
    }

    function requestFullscreenSafe(el) {
      try {
        if (!document.fullscreenElement && el.requestFullscreen) {
          el.requestFullscreen().catch(function () {});
        }
      } catch (_) {}
    }

    function exitFullscreenSafe() {
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        }
      } catch (_) {}
    }

    function closeDrawer() {
      drawer.classList.remove("open");
    }

    function openHostess(selectedLang) {
      setLanguage(selectedLang);
      closeDrawer();
      hostessOverlay.classList.add("active");
      requestFullscreenSafe(hostessOverlay);

      const media = HOSTESS_MEDIA[selectedLang] || {};
      const src = media.video || "";

      if (src) {
        if (hostessVideo.getAttribute("data-src") !== src) {
          hostessVideo.src = src;
          hostessVideo.setAttribute("data-src", src);
        }
        hostessVideo.style.display = "block";
        hostessVideo.currentTime = 0;
        hostessVideo.muted = false;
        hostessVideo.volume = 1.0;
        updateAudioLabel();

        const playPromise = hostessVideo.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(function () {
            hostessVideo.muted = true;
            updateAudioLabel();
            hostessVideo.play().catch(function () {});
          });
        }
      } else {
        hostessVideo.pause();
        hostessVideo.style.display = "none";
      }
    }

    function closeHostess() {
      hostessOverlay.classList.remove("active");
      hostessVideo.pause();
      exitFullscreenSafe();
    }

    function selectSpace(sp) {
      activeSpace = sp;
      updateBadge(sp[lang]);
      closeDrawer();
      closeHostess();
      if (typeof window.__lobbyBridge.focusSpace === "function") {
        window.__lobbyBridge.focusSpace(sp);
      }
    }

    function renderSpaceButtons() {
      const grid = document.getElementById("holo-spaces-grid");
      const quick = document.getElementById("hostess-spaces");
      grid.innerHTML = "";
      quick.innerHTML = "";

      SPACES.forEach(function (sp) {
        const b1 = document.createElement("button");
        b1.type = "button";
        b1.className = "holo-space-btn";
        b1.textContent = sp[lang];
        b1.addEventListener("click", function () { selectSpace(sp); });
        grid.appendChild(b1);

        const b2 = document.createElement("button");
        b2.type = "button";
        b2.className = "holo-space-btn";
        b2.textContent = sp[lang];
        b2.addEventListener("click", function () { selectSpace(sp); });
        quick.appendChild(b2);
      });
    }

    function setLanguage(newLang) {
      lang = newLang;
      const t = UI_TEXT[lang];
      document.getElementById("btn-lang-es").classList.toggle("active", lang === "es");
      document.getElementById("btn-lang-en").classList.toggle("active", lang === "en");
      document.getElementById("hostess-es").classList.toggle("active", lang === "es");
      document.getElementById("hostess-en").classList.toggle("active", lang === "en");

      document.getElementById("btn-guide").textContent = t.guide;
      document.getElementById("btn-spaces").textContent = t.spaces;
      document.getElementById("btn-center-sign").textContent = t.centerBtn;
      document.getElementById("hostess-enter").textContent = t.enterLobby;
      document.getElementById("hostess-title").textContent = t.hostessTitle;
      document.getElementById("hostess-sub").textContent = t.hostessSub;
      document.getElementById("holo-greeting").textContent = t.drawerHint;
      document.getElementById("fallback-sub").textContent = t.fallbackSub;
      updateAudioLabel();

      if (typeof window.__lobbyBridge.updateLang === "function") {
        window.__lobbyBridge.updateLang(lang);
      }

      updateBadge(activeSpace ? activeSpace[lang] : t.lobbyTitle);
      renderSpaceButtons();
    }

    document.getElementById("btn-lang-es").addEventListener("click", function () { openHostess("es"); });
    document.getElementById("btn-lang-en").addEventListener("click", function () { openHostess("en"); });
    document.getElementById("hostess-es").addEventListener("click", function () { openHostess("es"); });
    document.getElementById("hostess-en").addEventListener("click", function () { openHostess("en"); });
    document.getElementById("hostess-enter").addEventListener("click", closeHostess);

    audioBtn.addEventListener("click", function () {
      hostessVideo.muted = !hostessVideo.muted;
      if (!hostessVideo.muted) {
        hostessVideo.volume = 1.0;
        hostessVideo.play().catch(function () {});
      }
      updateAudioLabel();
    });

    document.getElementById("btn-guide").addEventListener("click", function () {
      drawer.classList.toggle("open");
    });

    document.getElementById("btn-spaces").addEventListener("click", function () {
      drawer.classList.toggle("open");
    });

    document.getElementById("btn-center-sign").addEventListener("click", function () {
      activeSpace = null;
      closeDrawer();
      updateBadge(lang === "es" ? "Lobby Central" : "Central Lobby");
      document.querySelectorAll(".bottom-bar .nav-btn").forEach(function (b) { b.classList.remove("active"); });
      document.getElementById("btn-center-sign").classList.add("active");
      if (typeof window.__lobbyBridge.waypoint === "function") {
        window.__lobbyBridge.waypoint("center", lang);
      }
    });

    document.querySelectorAll(".waypoint-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeSpace = null;
        closeDrawer();
        document.querySelectorAll(".bottom-bar .nav-btn").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        if (typeof window.__lobbyBridge.waypoint === "function") {
          window.__lobbyBridge.waypoint(btn.dataset.wp, lang);
        }
      });
    });

    document.getElementById("zoom-in").addEventListener("click", function () {
      if (typeof window.__lobbyBridge.zoom === "function") window.__lobbyBridge.zoom(0.22, false);
    });
    document.getElementById("zoom-out").addEventListener("click", function () {
      if (typeof window.__lobbyBridge.zoom === "function") window.__lobbyBridge.zoom(-0.22, false);
    });
    document.getElementById("zoom-reset").addEventListener("click", function () {
      if (typeof window.__lobbyBridge.zoom === "function") window.__lobbyBridge.zoom(1.0, true);
    });

    setLanguage("es");
  </script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js" onload="initLobby3D()" onerror="hide3DCanvas()"></script>
  <script>
    function hide3DCanvas() {
      const c = document.getElementById("scene-canvas");
      if (c) c.classList.remove("ready");
    }

    function initLobby3D() {
      const canvas = document.getElementById("scene-canvas");
      if (!window.THREE || !canvas) {
        hide3DCanvas();
        return;
      }

      try {
        const THREE = window.THREE;
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090e16);
        scene.fog = new THREE.FogExp2(0x090e16, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 180);

        const ENTRANCE_POS = new THREE.Vector3(0, 2.2, 16.5);
        const SIGN_LOOK_TARGET = new THREE.Vector3(0, 2.5, -13.5);

        const WAYPOINTS = {
          center: { pos: ENTRANCE_POS.clone(), look: SIGN_LOOK_TARGET.clone(), labelEs: "Lobby Central", labelEn: "Central Lobby" },
          west: { pos: new THREE.Vector3(-8.5, 2.2, 4.0), look: new THREE.Vector3(-14.5, 2.2, -3.0), labelEs: "Ala Oeste", labelEn: "West Wing" },
          east: { pos: new THREE.Vector3(8.5, 2.2, 4.0), look: new THREE.Vector3(14.5, 2.2, -3.0), labelEs: "Ala Este", labelEn: "East Wing" },
          level2: { pos: new THREE.Vector3(0, 7.6, 11.0), look: new THREE.Vector3(0, 7.2, -13.5), labelEs: "Nivel 2", labelEn: "Level 2" }
        };

        let currentCamPos = ENTRANCE_POS.clone();
        let targetCamPos = ENTRANCE_POS.clone();
        let currentLook = SIGN_LOOK_TARGET.clone();
        let targetLook = SIGN_LOOK_TARGET.clone();
        let zoomFactor = 1.0;
        let targetZoom = 1.0;

        scene.add(new THREE.AmbientLight(0xfff1d0, 1.05));
        const keyLight = new THREE.PointLight(0xffcf70, 2.4, 65);
        keyLight.position.set(0, 11, 0);
        scene.add(keyLight);

        const floor = new THREE.Mesh(
          new THREE.CircleGeometry(24, 64),
          new THREE.MeshStandardMaterial({ color: 0x18222d, roughness: 0.35, metalness: 0.45 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const goldRing = new THREE.Mesh(
          new THREE.RingGeometry(4.8, 5.3, 64),
          new THREE.MeshStandardMaterial({ color: 0xd9a441, roughness: 0.25, metalness: 0.85, side: THREE.DoubleSide })
        );
        goldRing.rotation.x = -Math.PI / 2;
        goldRing.position.y = 0.02;
        scene.add(goldRing);

        const atriumWall = new THREE.Mesh(
          new THREE.CylinderGeometry(23.5, 23.5, 15, 64, 1, true),
          new THREE.MeshStandardMaterial({ color: 0x111924, roughness: 0.7, metalness: 0.2, side: THREE.BackSide })
        );
        atriumWall.position.y = 7.5;
        scene.add(atriumWall);

        const balconyRing = new THREE.Mesh(
          new THREE.RingGeometry(18.5, 23.4, 64),
          new THREE.MeshStandardMaterial({ color: 0x253242, roughness: 0.5, metalness: 0.5, side: THREE.DoubleSide })
        );
        balconyRing.rotation.x = -Math.PI / 2;
        balconyRing.position.y = 5.6;
        scene.add(balconyRing);

        const sculpture = new THREE.Mesh(
          new THREE.OctahedronGeometry(2.1, 1),
          new THREE.MeshStandardMaterial({ color: 0xf7cf74, emissive: 0x473008, roughness: 0.2, metalness: 0.9 })
        );
        sculpture.position.set(0, 3.2, -1.5);
        scene.add(sculpture);

        function createSignTexture(text) {
          const c = document.createElement("canvas");
          c.width = 1024;
          c.height = 256;
          const ctx = c.getContext("2d");
          ctx.clearRect(0, 0, c.width, c.height);

          const grad = ctx.createLinearGradient(0, 40, 0, 210);
          grad.addColorStop(0, "#fff0b8");
          grad.addColorStop(0.5, "#e5b24c");
          grad.addColorStop(1, "#9c6d19");

          ctx.font = "bold 92px Georgia, serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.shadowColor = "rgba(255, 206, 94, 0.75)";
          ctx.shadowBlur = 24;
          ctx.fillStyle = grad;
          ctx.fillText(text, c.width / 2, c.height / 2);
          return new THREE.CanvasTexture(c);
        }

        const signPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(11.5, 2.9),
          new THREE.MeshBasicMaterial({ map: createSignTexture("D'Vitrales Mall"), transparent: true })
        );
        signPlane.position.set(0, 3.1, -13.5);
        scene.add(signPlane);

        const spaceMeshes = [];
        const radius = 21.8;

        function makeStoreTexture(title) {
          const c = document.createElement("canvas");
          c.width = 512;
          c.height = 256;
          const ctx = c.getContext("2d");
          ctx.fillStyle = "rgba(14, 24, 36, 0.92)";
          ctx.fillRect(0, 0, c.width, c.height);
          ctx.strokeStyle = "#e6b85c";
          ctx.lineWidth = 6;
          ctx.strokeRect(10, 10, c.width - 20, c.height - 20);
          ctx.fillStyle = "#ffe8a3";
          ctx.font = "bold 30px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          const words = title.split(" ");
          const lines = [];
          let line = "";
          for (let i = 0; i < words.length; i++) {
            const w = words[i];
            const test = line ? (line + " " + w) : w;
            if (ctx.measureText(test).width > 440) {
              lines.push(line);
              line = w;
            } else {
              line = test;
            }
          }
          if (line) lines.push(line);

          for (let j = 0; j < lines.length; j++) {
            const y = c.height / 2 + (j - (lines.length - 1) / 2) * 38;
            ctx.fillText(lines[j], c.width / 2, y);
          }
          return new THREE.CanvasTexture(c);
        }

        SPACES.forEach(function (sp) {
          const yPos = sp.level === 1 ? 2.4 : 7.8;
          const x = Math.sin(sp.angle) * radius;
          const z = Math.cos(sp.angle) * radius;

          const panel = new THREE.Mesh(
            new THREE.PlaneGeometry(5.2, 2.6),
            new THREE.MeshBasicMaterial({ map: makeStoreTexture(sp.es), side: THREE.DoubleSide })
          );
          panel.position.set(x, yPos, z);
          panel.lookAt(0, yPos, 0);
          panel.userData = { space: sp };
          scene.add(panel);
          spaceMeshes.push(panel);
        });

        window.__lobbyBridge.updateLang = function (currentLang) {
          spaceMeshes.forEach(function (m) {
            const sp = m.userData.space;
            m.material.map = makeStoreTexture(sp[currentLang]);
            m.material.needsUpdate = true;
          });
        };

        window.__lobbyBridge.focusSpace = function (sp) {
          const yPos = sp.level === 1 ? 2.3 : 7.6;
          const storePos = new THREE.Vector3(Math.sin(sp.angle) * radius, yPos, Math.cos(sp.angle) * radius);
          const inward = storePos.clone().setY(0).normalize().negate();

          targetCamPos.copy(storePos).addScaledVector(inward, 6.2).setY(yPos);
          targetLook.copy(storePos);
          targetZoom = 1.45;
        };

        window.__lobbyBridge.waypoint = function (key, currentLang) {
          const wp = WAYPOINTS[key];
          if (!wp) return;
          targetCamPos.copy(wp.pos);
          targetLook.copy(wp.look);
          targetZoom = 1.0;
          updateBadge(currentLang === "es" ? wp.labelEs : wp.labelEn);
        };

        window.__lobbyBridge.zoom = function (val, reset) {
          if (reset) {
            targetZoom = 1.0;
          } else {
            targetZoom = Math.max(0.75, Math.min(2.4, targetZoom + val));
          }
        };

        let isDragging = false;
        let prevX = 0;
        let prevY = 0;
        let dragDist = 0;
        let pinchStartDist = null;
        let pinchStartZoom = 1.0;

        function applyLookDelta(dx, dy) {
          const dir = targetLook.clone().sub(targetCamPos);
          const spherical = new THREE.Spherical().setFromVector3(dir);
          spherical.theta -= dx * 0.0055;
          spherical.phi = Math.max(0.35, Math.min(Math.PI - 0.35, spherical.phi - dy * 0.0045));
          dir.setFromSpherical(spherical);
          targetLook.copy(targetCamPos).add(dir);
        }

        canvas.addEventListener("pointerdown", function (e) {
          isDragging = true;
          prevX = e.clientX;
          prevY = e.clientY;
          dragDist = 0;
        });

        window.addEventListener("pointermove", function (e) {
          if (!isDragging) return;
          const dx = e.clientX - prevX;
          const dy = e.clientY - prevY;
          dragDist += Math.hypot(dx, dy);
          prevX = e.clientX;
          prevY = e.clientY;
          applyLookDelta(dx, dy);
        });

        const raycaster = new THREE.Raycaster();
        function checkSpaceTap(clientX, clientY) {
          const rect = canvas.getBoundingClientRect();
          const ndc = new THREE.Vector2(
            ((clientX - rect.left) / rect.width) * 2 - 1,
            -((clientY - rect.top) / rect.height) * 2 + 1
          );
          raycaster.setFromCamera(ndc, camera);
          const hits = raycaster.intersectObjects(spaceMeshes, false);
          if (hits.length > 0 && hits[0].object.userData.space) {
            selectSpace(hits[0].object.userData.space);
          }
        }

        window.addEventListener("pointerup", function (e) {
          if (!isDragging) return;
          isDragging = false;
          if (dragDist < 7) {
            checkSpaceTap(e.clientX, e.clientY);
          }
        });

        canvas.addEventListener("touchstart", function (e) {
          if (e.touches.length === 2) {
            pinchStartDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            pinchStartZoom = targetZoom;
          }
        }, { passive: true });

        canvas.addEventListener("touchmove", function (e) {
          if (e.touches.length === 2 && pinchStartDist) {
            const d = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            targetZoom = Math.max(0.75, Math.min(2.4, pinchStartZoom * (d / pinchStartDist)));
          }
        }, { passive: true });

        canvas.addEventListener("touchend", function () {
          pinchStartDist = null;
        });

        canvas.addEventListener("wheel", function (e) {
          e.preventDefault();
          targetZoom = Math.max(0.75, Math.min(2.4, targetZoom + (e.deltaY > 0 ? -0.14 : 0.14)));
        }, { passive: false });

        window.addEventListener("resize", function () {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        camera.position.copy(currentCamPos);
        camera.lookAt(currentLook);
        canvas.classList.add("ready");

        function animate() {
          requestAnimationFrame(animate);

          currentCamPos.lerp(targetCamPos, 0.08);
          currentLook.lerp(targetLook, 0.08);
          zoomFactor += (targetZoom - zoomFactor) * 0.1;

          camera.position.copy(currentCamPos);
          camera.fov = 60 / zoomFactor;
          camera.updateProjectionMatrix();
          camera.lookAt(currentLook);

          sculpture.rotation.y += 0.006;

          renderer.render(scene, camera);
        }

        animate();
      } catch (_) {
        hide3DCanvas();
      }
    }
  </script>
</body>
</html>
