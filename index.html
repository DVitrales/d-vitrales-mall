<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>D'Vitrales Mall — Lobby 3D</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #162638 0%, #090e16 70%, #05080d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff5dc;
    }

    #scene-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 1;
      touch-action: none;
    }

    #scene-canvas.ready {
      display: block;
    }

    #fallback-lobby {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 25%, rgba(255, 204, 92, 0.24), transparent 45%),
        radial-gradient(circle at 50% 70%, rgba(26, 120, 130, 0.24), transparent 55%),
        linear-gradient(180deg, #0b131e 0%, #070b10 100%);
    }

    .fallback-sign {
      font-family: Georgia, serif;
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 700;
      letter-spacing: 0.03em;
      background: linear-gradient(180deg, #fff1ba 0%, #e4b14b 55%, #9c6c18 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .fallback-note {
      font-size: 13px;
      color: rgba(255, 242, 204, 0.85);
      max-width: 440px;
      line-height: 1.45;
    }

    .fallback-status {
      margin-top: 10px;
      font-size: 11px;
      color: rgba(126, 249, 255, 0.88);
    }

    #focused-badge {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 40;
      max-width: 42vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      font-weight: 600;
      color: #ffe8a3;
      text-shadow: 0 0 10px rgba(255, 208, 102, 0.75), 0 1px 5px rgba(0, 0, 0, 0.98);
      pointer-events: none;
    }

    .holo-top-right {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 45;
      max-width: 56vw;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
    }

    .holo-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      pointer-events: auto;
    }

    .holo-key {
      background: rgba(10, 18, 28, 0.45);
      border: 1px solid rgba(255, 214, 115, 0.35);
      border-radius: 999px;
      outline: none;
      padding: 5px 10px;
      color: #fff2cc;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(6px);
      text-shadow: 0 0 10px rgba(255, 214, 115, 0.7), 0 1px 4px rgba(0, 0, 0, 0.98);
      transition: transform 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    }

    .holo-key:hover,
    .holo-key.active {
      color: #7ef9ff;
      border-color: rgba(126, 249, 255, 0.85);
      transform: translateY(-1px);
      text-shadow: 0 0 14px rgba(126, 249, 255, 0.95), 0 1px 6px rgba(0, 0, 0, 0.98);
    }

    .holo-drawer {
      position: fixed;
      top: 54px;
      right: 14px;
      z-index: 50;
      max-width: min(92vw, 420px);
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(9, 16, 26, 0.58);
      border: 1px solid rgba(255, 214, 115, 0.35);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .holo-drawer.open {
      display: flex;
    }

    .holo-greeting {
      text-align: right;
      font-size: 12px;
      line-height: 1.35;
      color: #fff6dc;
      text-shadow: 0 0 12px rgba(126, 249, 255, 0.45), 0 1px 6px rgba(0, 0, 0, 0.98);
    }

    .holo-spaces-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, auto));
      gap: 6px 14px;
      justify-items: end;
    }

    .holo-space-btn {
      background: transparent;
      border: none;
      outline: none;
      padding: 2px 0;
      text-align: right;
      font-size: 11.5px;
      font-weight: 600;
      color: #ffe9ad;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(255, 204, 92, 0.65), 0 1px 5px rgba(0, 0, 0, 0.98);
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .holo-space-btn:hover {
      color: #7ef9ff;
      transform: translateX(-2px);
      text-shadow: 0 0 14px rgba(126, 249, 255, 0.95), 0 1px 6px rgba(0, 0, 0, 0.98);
    }

    /* Anfitriona integrada como ventana/tarjeta compacta sin tapar el recorrido 3D */
    #hostess-card {
      position: fixed;
      left: 14px;
      bottom: 72px;
      z-index: 55;
      width: min(88vw, 290px);
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(8, 15, 24, 0.72);
      border: 1px solid rgba(255, 214, 115, 0.48);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      pointer-events: auto;
    }

    #hostess-card.active {
      display: flex;
    }

    .hostess-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .hostess-badge {
      font-size: 11.5px;
      font-weight: 700;
      color: #ffe8a3;
    }

    .hostess-close {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 214, 115, 0.35);
      border-radius: 999px;
      color: #fff2cc;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      cursor: pointer;
    }

    .hostess-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 10px;
      overflow: hidden;
      background: #05090f;
      border: 1px solid rgba(126, 249, 255, 0.25);
    }

    #hostess-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .hostess-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .hostess-mini-btn {
      background: rgba(255, 214, 115, 0.12);
      border: 1px solid rgba(255, 214, 115, 0.35);
      border-radius: 999px;
      color: #fff2cc;
      font-size: 10.5px;
      font-weight: 700;
      padding: 4px 9px;
      cursor: pointer;
    }

    .hostess-mini-btn.active {
      color: #7ef9ff;
      border-color: rgba(126, 249, 255, 0.8);
    }

    .bottom-bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 45;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: min(96vw, 820px);
      padding: 4px 8px;
      pointer-events: auto;
    }

    .nav-btn {
      background: rgba(10, 16, 24, 0.48);
      border: 1px solid rgba(255, 218, 122, 0.32);
      border-radius: 999px;
      color: #fff2cc;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 11px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255, 208, 102, 0.22);
      border-color: rgba(126, 249, 255, 0.8);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .zoom-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>
  <div id="fallback-lobby">
    <div class="fallback-sign">D'Vitrales Mall</div>
    <div id="fallback-sub" class="fallback-note">Recorre los dos niveles del lobby o abre ES / EN para escuchar a la anfitriona.</div>
    <div id="fallback-status" class="fallback-status">Cargando recorrido 3D...</div>
  </div>

  <canvas id="scene-canvas"></canvas>

  <div id="focused-badge">Lobby Central · Piso 1</div>

  <div class="holo-top-right">
    <div class="holo-row">
      <button id="btn-lang-es" class="holo-key" type="button">ES</button>
      <button id="btn-lang-en" class="holo-key" type="button">EN</button>
      <button id="btn-guide" class="holo-key" type="button">Guía</button>
      <button id="btn-spaces" class="holo-key" type="button">Locales</button>
    </div>
  </div>

  <div id="holo-drawer" class="holo-drawer">
    <div id="holo-greeting" class="holo-greeting">Toca un espacio para trasladarte:</div>
    <div id="holo-spaces-grid" class="holo-spaces-grid"></div>
  </div>

  <aside id="hostess-card" aria-live="polite">
    <div class="hostess-header">
      <span id="hostess-title" class="hostess-badge">Anfitriona D'Vitrales</span>
      <button id="hostess-close" class="hostess-close" type="button">✕</button>
    </div>
    <div class="hostess-frame">
      <video id="hostess-video" playsinline webkit-playsinline autoplay loop></video>
    </div>
    <div class="hostess-actions">
      <button id="hostess-es" class="hostess-mini-btn" type="button">ES</button>
      <button id="hostess-en" class="hostess-mini-btn" type="button">EN</button>
      <button id="hostess-audio" class="hostess-mini-btn" type="button">Audio ON</button>
    </div>
  </aside>

  <div class="bottom-bar">
    <button id="btn-center-sign" class="nav-btn active" type="button">Centro / Letrero</button>
    <button class="nav-btn waypoint-btn" data-wp="west" type="button">Ala Oeste</button>
    <button class="nav-btn waypoint-btn" data-wp="east" type="button">Ala Este</button>
    <button class="nav-btn waypoint-btn" data-wp="level2" type="button">Segundo Piso</button>
    <div class="zoom-group">
      <button id="zoom-out" class="nav-btn" type="button">-</button>
      <button id="zoom-reset" class="nav-btn" type="button">1x</button>
      <button id="zoom-in" class="nav-btn" type="button">+</button>
    </div>
  </div>

  <script>
    const HOSTESS_MEDIA = {
      es: { video: "anfitrionamp4.mp4" },
      en: { video: "anfitriona-en.mp4" }
    };

    const SPACES = [
      { id: "chocolatier", level: 1, angle: -2.2, es: "Chocolatier Gallery", en: "Chocolatier Gallery" },
      { id: "boutique", level: 1, angle: -1.65, es: "Boutique", en: "Boutique" },
      { id: "runway", level: 1, angle: -1.1, es: "Salón Pasarela de Boutique", en: "Boutique Runway Salon" },
      { id: "painting", level: 1, angle: 1.1, es: "Galería de Pintura", en: "Painting Gallery" },
      { id: "sculpture", level: 1, angle: 1.65, es: "Galería de Escultura", en: "Sculpture Gallery" },
      { id: "decor", level: 2, angle: -2.1, es: "Tienda Decoración para el Hogar", en: "Home Decor Store" },
      { id: "books", level: 2, angle: -1.55, es: "Tienda de Libros y Series", en: "Books & Series Store" },
      { id: "music", level: 2, angle: -1.0, es: "Tienda de Música", en: "Music Store" },
      { id: "school", level: 2, angle: 1.15, es: "Escuela de Pintura", en: "Painting School" },
      { id: "supplies", level: 2, angle: 1.7, es: "Tienda de Materiales para Arte", en: "Art Supplies Store" }
    ];

    const UI_TEXT = {
      es: {
        guide: "Guía",
        spaces: "Locales",
        centerBtn: "Centro / Letrero",
        level2Btn: "Segundo Piso",
        audioOn: "Audio ON",
        audioOff: "Audio OFF",
        lobbyTitle: "Lobby Central · Piso 1",
        hostessTitle: "Anfitriona D'Vitrales",
        drawerHint: "Toca un espacio para trasladarte:",
        fallbackSub: "Recorre los dos niveles del lobby o abre ES / EN para escuchar a la anfitriona."
      },
      en: {
        guide: "Guide",
        spaces: "Spaces",
        centerBtn: "Center / Sign",
        level2Btn: "Second Floor",
        audioOn: "Audio ON",
        audioOff: "Audio OFF",
        lobbyTitle: "Central Lobby · Floor 1",
        hostessTitle: "D'Vitrales Host",
        drawerHint: "Tap a space to travel there:",
        fallbackSub: "Explore both lobby levels or select ES / EN to hear the host."
      }
    };

    let lang = "es";
    let activeSpace = null;
    window.__lobbyBridge = {
      travelToSpace: null,
      waypoint: null,
      zoom: null,
      updateLang: null
    };

    const drawer = document.getElementById("holo-drawer");
    const hostessCard = document.getElementById("hostess-card");
    const hostessVideo = document.getElementById("hostess-video");
    const audioBtn = document.getElementById("hostess-audio");

    function updateBadge(text) {
      document.getElementById("focused-badge").textContent = text;
    }

    function updateAudioLabel() {
      const t = UI_TEXT[lang];
      audioBtn.textContent = hostessVideo.muted ? t.audioOff : t.audioOn;
      audioBtn.classList.toggle("active", !hostessVideo.muted);
    }

    function closeDrawer() {
      drawer.classList.remove("open");
    }

    function openHostess(selectedLang) {
      setLanguage(selectedLang);
      closeDrawer();
      hostessCard.classList.add("active");

      const media = HOSTESS_MEDIA[selectedLang] || {};
      const src = media.video || "";

      if (src) {
        if (hostessVideo.getAttribute("data-src") !== src) {
          hostessVideo.src = src;
          hostessVideo.setAttribute("data-src", src);
        }
        hostessVideo.currentTime = 0;
        hostessVideo.muted = false;
        hostessVideo.volume = 1.0;
        updateAudioLabel();

        const playPromise = hostessVideo.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(function () {
            hostessVideo.muted = true;
            updateAudioLabel();
            hostessVideo.play().catch(function () {});
          });
        }
      }
    }

    function closeHostess() {
      hostessCard.classList.remove("active");
      hostessVideo.pause();
    }

    // Traslado directo al espacio tocado sin bloquear el recorrido
    function selectSpace(sp) {
      activeSpace = sp;
      const floorLabel = lang === "es" ? "Piso " + sp.level : "Floor " + sp.level;
      updateBadge(sp[lang] + " · " + floorLabel);
      closeDrawer();
      if (typeof window.__lobbyBridge.travelToSpace === "function") {
        window.__lobbyBridge.travelToSpace(sp);
      }
    }

    function renderSpaceButtons() {
      const grid = document.getElementById("holo-spaces-grid");
      grid.innerHTML = "";

      SPACES.forEach(function (sp) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "holo-space-btn";
        btn.textContent = sp[lang] + " (P" + sp.level + ")";
        btn.addEventListener("click", function () { selectSpace(sp); });
        grid.appendChild(btn);
      });
    }

    function setLanguage(newLang) {
      lang = newLang;
      const t = UI_TEXT[lang];
      document.getElementById("btn-lang-es").classList.toggle("active", lang === "es");
      document.getElementById("btn-lang-en").classList.toggle("active", lang === "en");
      document.getElementById("hostess-es").classList.toggle("active", lang === "es");
      document.getElementById("hostess-en").classList.toggle("active", lang === "en");

      document.getElementById("btn-guide").textContent = t.guide;
      document.getElementById("btn-spaces").textContent = t.spaces;
      document.getElementById("btn-center-sign").textContent = t.centerBtn;
      document.querySelector('[data-wp="level2"]').textContent = t.level2Btn;
      document.getElementById("hostess-title").textContent = t.hostessTitle;
      document.getElementById("holo-greeting").textContent = t.drawerHint;
      document.getElementById("fallback-sub").textContent = t.fallbackSub;
      updateAudioLabel();

      if (typeof window.__lobbyBridge.updateLang === "function") {
        window.__lobbyBridge.updateLang(lang);
      }

      if (activeSpace) {
        const floorLabel = lang === "es" ? "Piso " + activeSpace.level : "Floor " + activeSpace.level;
        updateBadge(activeSpace[lang] + " · " + floorLabel);
      } else {
        updateBadge(t.lobbyTitle);
      }
      renderSpaceButtons();
    }

    document.getElementById("btn-lang-es").addEventListener("click", function () { openHostess("es"); });
    document.getElementById("btn-lang-en").addEventListener("click", function () { openHostess("en"); });
    document.getElementById("hostess-es").addEventListener("click", function () { openHostess("es"); });
    document.getElementById("hostess-en").addEventListener("click", function () { openHostess("en"); });
    document.getElementById("hostess-close").addEventListener("click", closeHostess);

    audioBtn.addEventListener("click", function () {
      hostessVideo.muted = !hostessVideo.muted;
      if (!hostessVideo.muted) {
        hostessVideo.volume = 1.0;
        hostessVideo.play().catch(function () {});
      }
      updateAudioLabel();
    });

    document.getElementById("btn-guide").addEventListener("click", function () {
      drawer.classList.toggle("open");
    });

    document.getElementById("btn-spaces").addEventListener("click", function () {
      drawer.classList.toggle("open");
    });

    document.getElementById("btn-center-sign").addEventListener("click", function () {
      activeSpace = null;
      closeDrawer();
      updateBadge(lang === "es" ? "Lobby Central · Piso 1" : "Central Lobby · Floor 1");
      document.querySelectorAll(".bottom-bar .nav-btn").forEach(function (b) { b.classList.remove("active"); });
      document.getElementById("btn-center-sign").classList.add("active");
      if (typeof window.__lobbyBridge.waypoint === "function") {
        window.__lobbyBridge.waypoint("center", lang);
      }
    });

    document.querySelectorAll(".waypoint-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeSpace = null;
        closeDrawer();
        document.querySelectorAll(".bottom-bar .nav-btn").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        if (typeof window.__lobbyBridge.waypoint === "function") {
          window.__lobbyBridge.waypoint(btn.dataset.wp, lang);
        }
      });
    });

    document.getElementById("zoom-in").addEventListener("click", function () {
      if (typeof window.__lobbyBridge.zoom === "function") window.__lobbyBridge.zoom(0.25, false);
    });
    document.getElementById("zoom-out").addEventListener("click", function () {
      if (typeof window.__lobbyBridge.zoom === "function") window.__lobbyBridge.zoom(-0.25, false);
    });
    document.getElementById("zoom-reset").addEventListener("click", function () {
      if (typeof window.__lobbyBridge.zoom === "function") window.__lobbyBridge.zoom(1.0, true);
    });

    setLanguage("es");
  </script>

  <script type="module">
    function setFallbackStatus(msg) {
      const st = document.getElementById("fallback-status");
      if (st) st.textContent = msg;
    }

    async function loadThreeModule() {
      const urls = [
        "https://esm.sh/three@0.164.1",
        "https://cdn.jsdelivr.net/npm/three@0.164.1/+esm",
        "https://cdn.skypack.dev/three@0.164.1"
      ];
      for (const u of urls) {
        try {
          const mod = await import(u);
          if (mod && mod.WebGLRenderer) return mod;
        } catch (_) {}
      }
      return null;
    }

    async function start3D() {
      const canvas = document.getElementById("scene-canvas");
      const THREE = await loadThreeModule();
      if (!THREE || !canvas) {
        setFallbackStatus("Navegación y anfitriona listas; sin conexión al motor 3D en este momento.");
        return;
      }

      try {
        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          powerPreference: "high-performance"
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090e16);
        scene.fog = new THREE.FogExp2(0x090e16, 0.0085);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 180);

        const WAYPOINTS = {
          center: { x: 0, y: 2.2, z: 11.5, lookX: 0, lookY: 2.6, lookZ: -2.0, labelEs: "Lobby Central · Piso 1", labelEn: "Central Lobby · Floor 1" },
          west: { x: -8.5, y: 2.2, z: 7.5, lookX: -12.0, lookY: 2.5, lookZ: -8.0, labelEs: "Ala Oeste · Piso 1", labelEn: "West Wing · Floor 1" },
          east: { x: 8.5, y: 2.2, z: 7.5, lookX: 12.0, lookY: 2.5, lookZ: -8.0, labelEs: "Ala Este · Piso 1", labelEn: "East Wing · Floor 1" },
          level2: { x: 0, y: 7.2, z: 12.0, lookX: 0, lookY: 7.2, lookZ: -4.0, labelEs: "Segundo Piso", labelEn: "Second Floor" }
        };

        let camPos = new THREE.Vector3(WAYPOINTS.center.x, WAYPOINTS.center.y, WAYPOINTS.center.z);
        let targetPos = camPos.clone();
        let lookAtPos = new THREE.Vector3(WAYPOINTS.center.lookX, WAYPOINTS.center.lookY, WAYPOINTS.center.lookZ);
        let targetLook = lookAtPos.clone();
        let yawOffset = 0;
        let pitchOffset = 0;

        scene.add(new THREE.AmbientLight(0xfff1d0, 1.25));
        const keyLight = new THREE.PointLight(0xffcf70, 2.8, 75);
        keyLight.position.set(0, 11, 2);
        scene.add(keyLight);

        // Piso primer nivel
        const floor = new THREE.Mesh(
          new THREE.CircleGeometry(24, 64),
          new THREE.MeshStandardMaterial({ color: 0x162230, roughness: 0.35, metalness: 0.45 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Aro central dorado
        const goldRing = new THREE.Mesh(
          new THREE.RingGeometry(4.4, 5.0, 64),
          new THREE.MeshStandardMaterial({ color: 0xd9a441, roughness: 0.25, metalness: 0.85, side: THREE.DoubleSide })
        );
        goldRing.rotation.x = -Math.PI / 2;
        goldRing.position.y = 0.02;
        scene.add(goldRing);

        // Pasarela / plataforma perimetral segundo piso
        const level2Deck = new THREE.Mesh(
          new THREE.RingGeometry(14.5, 19.2, 64),
          new THREE.MeshStandardMaterial({ color: 0x1d2b3b, roughness: 0.45, metalness: 0.5, side: THREE.DoubleSide })
        );
        level2Deck.rotation.x = -Math.PI / 2;
        level2Deck.position.y = 5.6;
        scene.add(level2Deck);

        const sculpture = new THREE.Mesh(
          new THREE.OctahedronGeometry(1.85, 1),
          new THREE.MeshStandardMaterial({ color: 0xf7cf74, emissive: 0x473008, roughness: 0.2, metalness: 0.9 })
        );
        sculpture.position.set(0, 2.9, -1.5);
        scene.add(sculpture);

        function createSignTexture(text) {
          const c = document.createElement("canvas");
          c.width = 1024;
          c.height = 256;
          const ctx = c.getContext("2d");
          ctx.clearRect(0, 0, c.width, c.height);

          const grad = ctx.createLinearGradient(0, 40, 0, 210);
          grad.addColorStop(0, "#fff0b8");
          grad.addColorStop(0.5, "#e5b24c");
          grad.addColorStop(1, "#9c6d19");

          ctx.font = "bold 88px Georgia, serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.shadowColor = "rgba(255, 206, 94, 0.75)";
          ctx.shadowBlur = 22;
          ctx.fillStyle = grad;
          ctx.fillText(text, c.width / 2, c.height / 2);
          return new THREE.CanvasTexture(c);
        }

        const signPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(10.5, 2.6),
          new THREE.MeshBasicMaterial({ map: createSignTexture("D'Vitrales Mall"), transparent: true })
        );
        signPlane.position.set(0, 3.1, -11.5);
        scene.add(signPlane);

        const spaceMeshes = [];
        const radius = 17.2;

        // Letreros con transparencia real para ver el recorrido detrás
        function makeTransparentStoreTexture(title) {
          const c = document.createElement("canvas");
          c.width = 512;
          c.height = 256;
          const ctx = c.getContext("2d");
          ctx.clearRect(0, 0, c.width, c.height);

          ctx.fillStyle = "rgba(12, 22, 34, 0.22)";
          ctx.fillRect(10, 10, c.width - 20, c.height - 20);

          ctx.strokeStyle = "rgba(240, 198, 102, 0.75)";
          ctx.lineWidth = 3;
          ctx.strokeRect(10, 10, c.width - 20, c.height - 20);

          ctx.fillStyle = "#fff3c8";
          ctx.font = "bold 28px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
          ctx.shadowBlur = 10;

          const words = title.split(" ");
          const lines = [];
          let line = "";
          for (const w of words) {
            const test = line ? (line + " " + w) : w;
            if (ctx.measureText(test).width > 430) {
              lines.push(line);
              line = w;
            } else {
              line = test;
            }
          }
          if (line) lines.push(line);

          lines.forEach((txt, idx) => {
            const y = c.height / 2 + (idx - (lines.length - 1) / 2) * 36;
            ctx.fillText(txt, c.width / 2, y);
          });
          return new THREE.CanvasTexture(c);
        }

        SPACES.forEach((sp) => {
          const yPos = sp.level === 1 ? 2.4 : 7.3;
          const x = Math.sin(sp.angle) * radius;
          const z = Math.cos(sp.angle) * radius;

          const panel = new THREE.Mesh(
            new THREE.PlaneGeometry(5.0, 2.5),
            new THREE.MeshBasicMaterial({
              map: makeTransparentStoreTexture(sp.es),
              transparent: true,
              opacity: 0.85,
              side: THREE.DoubleSide,
              depthWrite: false
            })
          );
          panel.position.set(x, yPos, z);
          panel.lookAt(0, yPos, 0);
          panel.userData = { space: sp };
          scene.add(panel);
          spaceMeshes.push(panel);
        });

        window.__lobbyBridge.updateLang = (currentLang) => {
          spaceMeshes.forEach((m) => {
            const sp = m.userData.space;
            m.material.map = makeTransparentStoreTexture(sp[currentLang]);
            m.material.needsUpdate = true;
          });
        };

        // Traslado directo hacia la ubicación del espacio elegido
        window.__lobbyBridge.travelToSpace = (sp) => {
          const yPos = sp.level === 1 ? 2.3 : 7.2;
          const destX = Math.sin(sp.angle) * (radius - 6.2);
          const destZ = Math.cos(sp.angle) * (radius - 6.2);
          const lookX = Math.sin(sp.angle) * radius;
          const lookZ = Math.cos(sp.angle) * radius;

          yawOffset = 0;
          pitchOffset = 0;
          targetPos.set(destX, yPos, destZ);
          targetLook.set(lookX, yPos, lookZ);
        };

        window.__lobbyBridge.waypoint = (key, currentLang) => {
          const wp = WAYPOINTS[key];
          if (!wp) return;
          yawOffset = 0;
          pitchOffset = 0;
          targetPos.set(wp.x, wp.y, wp.z);
          targetLook.set(wp.lookX, wp.lookY, wp.lookZ);
          updateBadge(currentLang === "es" ? wp.labelEs : wp.labelEn);
        };

        window.__lobbyBridge.zoom = (val, reset) => {
          if (reset) {
            targetPos.set(WAYPOINTS.center.x, WAYPOINTS.center.y, WAYPOINTS.center.z);
            targetLook.set(WAYPOINTS.center.lookX, WAYPOINTS.center.lookY, WAYPOINTS.center.lookZ);
            yawOffset = 0;
            pitchOffset = 0;
            return;
          }
          const dir = new THREE.Vector3().subVectors(targetLook, targetPos);
          const currentLen = dir.length();
          const nextLen = Math.max(5.5, Math.min(22.0, currentLen - val * 6));
          dir.normalize().multiplyScalar(nextLen);
          targetPos.copy(targetLook).sub(dir);
        };

        // Mirar alrededor con arrastre suave sin perder la posición del recorrido
        let isDragging = false;
        let prevX = 0;
        let prevY = 0;
        let dragDist = 0;
        let pinchStartDist = null;

        canvas.addEventListener("pointerdown", (e) => {
          isDragging = true;
          prevX = e.clientX;
          prevY = e.clientY;
          dragDist = 0;
        });

        window.addEventListener("pointermove", (e) => {
          if (!isDragging) return;
          const dx = e.clientX - prevX;
          const dy = e.clientY - prevY;
          dragDist += Math.hypot(dx, dy);
          prevX = e.clientX;
          prevY = e.clientY;

          yawOffset -= dx * 0.0035;
          pitchOffset = Math.max(-0.35, Math.min(0.45, pitchOffset - dy * 0.0025));
        });

        const raycaster = new THREE.Raycaster();
        function checkSpaceTap(clientX, clientY) {
          const rect = canvas.getBoundingClientRect();
          const ndc = new THREE.Vector2(
            ((clientX - rect.left) / rect.width) * 2 - 1,
            -((clientY - rect.top) / rect.height) * 2 + 1
          );
          raycaster.setFromCamera(ndc, camera);
          const hits = raycaster.intersectObjects(spaceMeshes, false);
          if (hits.length > 0 && hits[0].object.userData.space) {
            selectSpace(hits[0].object.userData.space);
          }
        }

        window.addEventListener("pointerup", (e) => {
          if (!isDragging) return;
          isDragging = false;
          if (dragDist < 7) {
            checkSpaceTap(e.clientX, e.clientY);
          }
        });

        canvas.addEventListener("touchstart", (e) => {
          if (e.touches.length === 2) {
            isDragging = false;
            pinchStartDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
          }
        }, { passive: true });

        canvas.addEventListener("touchmove", (e) => {
          if (e.touches.length === 2 && pinchStartDist) {
            const d = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            const factor = pinchStartDist / d;
            pinchStartDist = d;
            const dir = new THREE.Vector3().subVectors(targetLook, targetPos);
            const nextLen = Math.max(5.5, Math.min(22.0, dir.length() * factor));
            dir.normalize().multiplyScalar(nextLen);
            targetPos.copy(targetLook).sub(dir);
          }
        }, { passive: true });

        canvas.addEventListener("touchend", () => {
          pinchStartDist = null;
        });

        canvas.addEventListener("wheel", (e) => {
          e.preventDefault();
          const dir = new THREE.Vector3().subVectors(targetLook, targetPos);
          const nextLen = Math.max(5.5, Math.min(22.0, dir.length() + (e.deltaY > 0 ? 1.2 : -1.2)));
          dir.normalize().multiplyScalar(nextLen);
          targetPos.copy(targetLook).sub(dir);
        }, { passive: false });

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function applyCameraTransform() {
          camera.position.copy(camPos);
          const baseDir = new THREE.Vector3().subVectors(lookAtPos, camPos);
          const euler = new THREE.Euler(pitchOffset, yawOffset, 0, "YXZ");
          baseDir.applyEuler(euler);
          camera.lookAt(camPos.clone().add(baseDir));
        }

        applyCameraTransform();
        canvas.classList.add("ready");

        function animate() {
          requestAnimationFrame(animate);

          camPos.lerp(targetPos, 0.12);
          lookAtPos.lerp(targetLook, 0.12);

          applyCameraTransform();
          sculpture.rotation.y += 0.004;

          renderer.render(scene, camera);
        }

        animate();
      } catch (_) {
        setFallbackStatus("No se pudo iniciar WebGL en este navegador; la navegación sigue activa.");
      }
    }

    start3D();
  </script>
</body>
</html>
