<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique de Moda y Alta Costura - D'Vitrales Mall</title>
    <!-- Librería A-Frame para Realidad Virtual -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .boton-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(43, 31, 24, 0.85);
            color: #f7f1e8;
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #d4af37;
            font-size: 14px;
        }
        .boton-carrito {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 999;
            background: #d4af37;
            color: #21150e;
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 14px;
        }
        /* Ventana Modal / Emergente de Información, Tallas y Diseñador */
        #modal-producto {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            max-height: 85vh;
            overflow-y: auto;
            background: #f7f1e8;
            color: #21150e;
            padding: 20px;
            border-radius: 12px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-family: Arial, sans-serif;
            border: 2px solid #d4af37;
        }
        #modal-producto h3 { margin-top: 0; color: #4a2e1b; border-bottom: 1px solid #d4af37; padding-bottom: 5px; }
        .seccion-info { font-size: 13px; margin: 8px 0; line-height: 1.4; }
        .btn-accion {
            background: #5c3a21;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .btn-cerrar {
            background: #a94442;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Botones de navegación superior -->
    <a href="index.html" class="boton-volver">⬅ Volver al Mall</a>
    <button class="boton-carrito" onclick="verCarrito()">🛒 Carrito (<span id="contador-carrito">0</span>)</button>

    <!-- VENTANA EMERGENTE (MODAL) PARA PRENDA Y DISEÑADOR -->
    <div id="modal-producto">
        <h3 id="modal-titulo">Nombre del Diseño</h3>
        <p class="seccion-info"><strong>Diseñador/a:</strong> <span id="modal-artista">Nombre del Creador</span></p>
        <p class="seccion-info"><strong>Estilo y Biografía:</strong> <span id="modal-bio">Reseña de la colección.</span></p>
        <p class="seccion-info"><strong>Tallas y Materiales:</strong> <span id="modal-material">Tejidos y opciones de ajuste.</span></p>
        <p class="seccion-info"><strong>Precio:</strong> <span id="modal-precio" style="color: #8b5a2b; font-weight: bold;">$0.00</span></p>
        <button class="btn-accion" onclick="agregarAlCarritoFromModal()">Adquirir Prenda 👗</button>
        <button class="btn-accion btn-cerrar" onclick="cerrarModal()">Cerrar</button>
    </div>

    <!-- Escenario 3D de la Boutique de Moda -->
    <a-scene>
        <!-- Iluminación cálida y enfocada para resaltar texturas y telas -->
        <a-light type="ambient" color="#fff3ed" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.7" position="2 6 3"></a-light>
        <a-light type="point" color="#fffaed" intensity="0.6" position="0 4 0"></a-light>

        <!-- Cielo exterior -->
        <a-sky color="#1a120e"></a-sky>

        <!-- Piso de la boutique (Efecto parqué o mármol claro elegante) -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="16" height="16" color="#362920"></a-plane>

        <!-- PAREDES DE LA BOUTIQUE -->
        <a-plane position="0 3 -8" width="16" height="6" color="#4a382c"></a-plane>
        <a-plane position="-8 3 0" rotation="0 90 0" width="16" height="6" color="#3d2e23"></a-plane>
        <a-plane position="8 3 0" rotation="0 -90 0" width="16" height="6" color="#3d2e23"></a-plane>

        <!-- ================= MOBILIARIO DECORATIVO DEL SALÓN ================= -->
        <!-- Sofá de prueba / descanso central -->
        <a-box position="0 0.3 -2" width="2.4" height="0.4" depth="0.9" color="#261c14"></a-box>
        <a-box position="0 0.7 -2.35" width="2.4" height="0.6" depth="0.15" color="#261c14"></a-box>

        <!-- Espejo decorativo de cuerpo entero en pared lateral -->
        <a-box position="-7.9 2.8 0" rotation="0 90 0" width="2.6" height="4.2" depth="0.05" color="#d4af37"></a-box>
        <a-plane position="-7.85 2.8 0" rotation="0 90 0" width="2.4" height="4.0" color="#a6b9c7"></a-plane>

        <!-- ================= MANIQUÍ CENTRAL (COLECCIÓN PRINCIPAL) ================= -->
        <a-entity position="0 0 0" onclick="mostrarDetalle('Vestido de Gala Satín Champagne', 'D'Vitrales Fashion', 'Colección de alta costura inspirada en la elegancia clásica, líneas estructuradas y acabados impecables.', 'Tallas disponibles: S, M, L. Material: Satín de seda importado con detalles bordados a mano.', 350.00)">
            <!-- Base del maniquí -->
            <a-cylinder position="0 0.4 0" radius="0.4" height="0.1" color="#21150e"></a-cylinder>
            <!-- Torso / Vestido simulado -->
            <a-cylinder position="0 1.4 0" radius="0.35" height="1.6" color="#d4af37"></a-cylinder>
            <!-- Cabeza decorativa estilizada -->
            <a-sphere position="0 2.4 0" radius="0.2" color="#5c3a21"></a-sphere>
        </a-entity>

        <!-- ================= MANIQUÍ IZQUIERDO ================= -->
        <a-entity position="-4 0 -2" onclick="mostrarDetalle('Chaqueta Estructurada & Pantalón', 'Vances Studio', 'Diseños vanguardistas que fusionan la sastrería clásica con una silueta moderna y protectora.', 'Tallas disponibles: XS, S, M, L. Colores: Olivo, Bronce y Champagne. Tejido semirrígido de alta durabilidad.', 280.00)">
            <a-cylinder position="0 0.4 0" radius="0.35" height="0.1" color="#21150e"></a-cylinder>
            <a-cylinder position="0 1.3 0" radius="0.3" height="1.4" color="#5c4435"></a-cylinder>
            <a-sphere position="0 2.1 0" radius="0.18" color="#423126"></a-sphere>
        </a-entity>

        <!-- ================= MANIQUÍ DERECHO ================= -->
        <a-entity position="4 0 -2" onclick="mostrarDetalle('Blusa de Seda y Botines de Autor', 'D'Vitrales Studio', 'Conjunto exclusivo enfocado en la comodidad sofisticada para creadoras y artistas independientes.', 'Tallas disponibles: S, M, L. Material: Seda natural vaporosa combinada con detalles artesanales.', 210.00)">
            <a-cylinder position="0 0.4 0" radius="0.35" height="0.1" color="#21150e"></a-cylinder>
            <a-cylinder position="0 1.3 0" radius="0.3" height="1.4" color="#7a5c47"></a-cylinder>
            <a-sphere position="0 2.1 0" radius="0.18" color="#423126"></a-sphere>
        </a-entity>

        <!-- Cámara de recorrido libre -->
        <a-entity id="camera" camera look-controls wasd-controls position="0 1.6 6">
            <a-cursor color="#ead7c0"></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        let prendaActual = "";
        let precioActual = 0;
        let carrito = [];

        function mostrarDetalle(titulo, artista, bio, material, precio) {
            prendaActual = titulo;
            precioActual = precio;
            document.getElementById('modal-titulo').innerText = titulo;
            document.getElementById('modal-artista').innerText = artista;
            document.getElementById('modal-bio').innerText = bio;
            document.getElementById('modal-material').innerText = material;
            document.getElementById('modal-precio').innerText = "$" + precio.toFixed(2);
            document.getElementById('modal-producto').style.display = 'block';
        }

        function cerrarModal() {
            document.getElementById('modal-producto').style.display = 'none';
        }

        function agregarAlCarritoFromModal() {
            carrito.push({ nombre: prendaActual, precio: precioActual });
            document.getElementById('contador-carrito').innerText = carrito.length;
            alert("¡La prenda \"" + prendaActual + "\" se ha añadido al carrito de compras!");
            cerrarModal();
        }

        function verCarrito() {
            if (carrito.length === 0) {
                alert("Tu carrito de compras en esta boutique está vacío.");
            } else {
                let resumen = "Prendas en tu carrito:\n";
                let total = 0;
                carrito.forEach((item, index) => {
                    resumen += (index + 1) + ". " + item.nombre + " - $" + item.precio.toFixed(2) + "\n";
                    total += item.precio;
                });
                resumen += "\nTotal de la selección: $" + total.toFixed(2);
                alert(resumen);
            }
        }
    </script>

</body>
</html>
