<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique y Pasarela de Moda 3D - D'Vitrales Mall</title>
    <!-- Librería A-Frame para Realidad Virtual -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        .boton-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(63, 48, 37, 0.85);
            color: #f7f1e8;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #ead7c0;
        }
    </style>
</head>
<body>

    <!-- Botón para regresar al centro comercial -->
    <a href="index.html" class="boton-volver">⬅ Volver al Centro Comercial</a>

    <!-- Escenario 3D de la Boutique y Pasarela -->
    <a-scene>
        <!-- Luces de pasarela e iluminación brillante tipo desfile -->
        <a-light type="ambient" color="#fff8f0" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.7" position="0 6 2"></a-light>
        <a-light type="point" color="#fffaef" intensity="0.5" position="0 4 -3"></a-light>

        <!-- Ambiente exterior elegante -->
        <a-sky color="#1f1815"></a-sky>

        <!-- Piso principal de la Boutique (Efecto parquet o pasarela oscura) -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="16" height="18" color="#302621"></a-plane>

        <!-- PASARELA CENTRAL (Plataforma elevada y luminosa) -->
        <!-- Suelo de la pasarela -->
        <a-plane position="0 0.05 -1" rotation="-90 0 0" width="3.5" height="12" color="#f7f1e8"></a-plane>
        <!-- Bordes iluminados de la pasarela -->
        <a-box position="-1.77 0.08 -1" width="0.06" height="0.04" depth="12" color="#d4af37"></a-box>
        <a-box position="1.77 0.08 -1" width="0.06" height="0.04" depth="12" color="#d4af37"></a-box>
        <!-- Fondo / Escenario de la pasarela (Backstage / Pantalla LED virtual) -->
        <a-plane position="0 3 -7" width="16" height="6" color="#2b201a"></a-plane>
        <a-box position="0 3 -6.95" width="5" height="4" depth="0.05" color="#1a1412"></a-box>
        <a-plane position="0 3 -6.9" width="4.8" height="3.8" color="#d9c5b2"></a-plane>

        <!-- PAREDES LATERALES DE LA BOUTIQUE -->
        <a-plane position="-8 3 1" rotation="0 90 0" width="18" height="6" color="#42352c"></a-plane>
        <a-plane position="8 3 1" rotation="0 -90 0" width="18" height="6" color="#42352c"></a-plane>
        <a-plane position="0 3 10" rotation="0 180 0" width="16" height="6" color="#42352c"></a-plane>

        <!-- ZONA DE EXHIBICIÓN DE ROPA (Percheros y Estantes laterales) -->
        <!-- Perchero Izquierdo -->
        <a-box position="-6 1.5 -2" width="0.1" height="2" depth="3" color="#1a1412"></a-box>
        <a-box position="-6 2.5 -2" width="0.8" height="0.1" depth="3" color="#d4af37"></a-box>
        
        <!-- Perchero Derecho -->
        <a-box position="6 1.5 -2" width="0.1" height="2" depth="3" color="#1a1412"></a-box>
        <a-box position="6 2.5 -2" width="0.8" height="0.1" depth="3" color="#d4af37"></a-box>

        <!-- MANIQUÍES / MODELOS (Estructuras estáticas simulando maniquíes en pasarela) -->
        <!-- Maniquí 1 (Inicio de pasarela - Izquierda) -->
        <a-cylinder position="-0.9 0.9 3" radius="0.25" height="1.8" color="#e8d5c1"></a-cylinder>
        <a-sphere position="-0.9 2.0 3" radius="0.2" color="#d9c4b0"></a-sphere>

        <!-- Maniquí 2 (Inicio de pasarela - Derecha) -->
        <a-cylinder position="0.9 0.9 3" radius="0.25" height="1.8" color="#e8d5c1"></a-cylinder>
        <a-sphere position="0.9 2.0 3" radius="0.2" color="#d9c4b0"></a-sphere>

        <!-- SILLONES / ASIENTOS PARA ESPECTADORES A LOS LADOS -->
        <!-- Fila Izquierda -->
        <a-box position="-4 0.4 2" width="1.2" height="0.5" depth="0.8" color="#5c4435"></a-box>
        <a-box position="-4 0.4 4" width="1.2" height="0.5" depth="0.8" color="#5c4435"></a-box>
        
        <!-- Fila Derecha -->
        <a-box position="4 0.4 2" width="1.2" height="0.5" depth="0.8" color="#5c4435"></a-box>
        <a-box position="4 0.4 4" width="1.2" height="0.5" depth="0.8" color="#5c4435"></a-box>

        <!-- Cámara de recorrido virtual libre -->
        <a-entity id="camera" camera look-controls wasd-controls position="0 1.6 8">
            <a-cursor color="#ead7c0"></a-cursor>
        </a-entity>
    </a-scene>

</body>
</html>
