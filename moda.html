<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D'Vitrales Mall — Tienda Boutique 3D</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1914;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #f7f4eb;
    }

    a-scene {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* HUD ligero y despejado para no cubrir el espacio 3D */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
    }

    body.hud-clean .hud-collapsible {
      display: none !important;
    }

    .glass-bar {
      pointer-events: auto;
      background: rgba(8, 34, 25, 0.52);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(230, 190, 106, 0.48);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .title-wrap .tag {
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #e6be6a;
      font-weight: 700;
      display: block;
    }

    .title-wrap h1 {
      margin: 2px 0 0;
      font-size: 14px;
      font-weight: 700;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    button, a.link-btn {
      pointer-events: auto;
      background: rgba(11, 79, 58, 0.65);
      color: #f7f4eb;
      border: 1px solid rgba(230, 190, 106, 0.48);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    button.active, a.link-btn.active {
      background: #e6be6a;
      color: #082219;
      border-color: #e6be6a;
    }

    /* Tarjeta inferior compacta de la pieza seleccionada en tienda */
    .item-card {
      pointer-events: auto;
      background: rgba(8, 34, 25, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(230, 190, 106, 0.52);
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .item-meta strong {
      color: #e6be6a;
      font-size: 13px;
      display: block;
    }

    .item-meta span {
      font-size: 11px;
      color: #e2dcd0;
    }
  </style>
</head>
<body>
  <a-scene id="boutiqueStoreScene" vr-mode-ui="enabled: true" renderer="antialias: true; colorManagement: true">
    <a-assets>
      <canvas id="storeMarble" width="512" height="512"></canvas>
      <canvas id="storeEmerald" width="512" height="512"></canvas>
    </a-assets>

    <!-- Iluminación del salón de tienda -->
    <a-light type="ambient" color="#fff8eb" intensity="0.95"></a-light>
    <a-light type="directional" color="#fff3d9" intensity="1.1" position="4 7 5"></a-light>
    <a-light type="point" color="#ffe09e" intensity="1.0" distance="12" position="0 3.2 -1"></a-light>

    <a-sky color="#13221c"></a-sky>

    <!-- Piso de mármol claro -->
    <a-circle radius="15" rotation="-90 0 0" position="0 0 0"
              material="src: #storeMarble; repeat: 6 6; roughness: 0.25"></a-circle>

    <!-- Muro posterior esmeralda con molduras doradas -->
    <a-entity position="0 0 -6.2">
      <a-box width="15" height="5" depth="0.25" position="0 2.5 0"
             material="src: #storeEmerald; roughness: 0.35"></a-box>
      <a-box width="3.4" height="0.07" depth="0.34" position="0 4.0 0.05"
             material="color: #e6be6a; metalness: 0.7; roughness: 0.25"></a-box>
      <a-box width="3.4" height="0.07" depth="0.34" position="0 0.3 0.05"
             material="color: #e6be6a; metalness: 0.7; roughness: 0.25"></a-box>
    </a-entity>

    <!-- Pedestal 1 (Izquierda): Pieza de exhibición -->
    <a-entity id="stand-1" position="-2.6 0 -2.6">
      <a-cylinder radius="0.85" height="0.16" position="0 0.08 0" color="#073829"></a-cylinder>
      <a-torus radius="0.85" radius-tubular="0.02" rotation="90 0 0" position="0 0.16 0" color="#e6be6a"></a-torus>
      <a-cylinder radius="0.03" height="1.45" position="0 0.88 0" color="#e6be6a"></a-cylinder>
      <a-cone id="piece-1" radius-bottom="0.46" radius-top="0.15" height="0.85" position="0 1.25 0"
              material="color: #f4be38; roughness: 0.45"></a-cone>
    </a-entity>

    <!-- Pedestal 2 (Centro): Pieza principal en exhibición -->
    <a-entity id="stand-2" position="0 0 -3.2">
      <a-cylinder radius="1.0" height="0.18" position="0 0.09 0" color="#073829"></a-cylinder>
      <a-torus radius="1.0" radius-tubular="0.025" rotation="90 0 0" position="0 0.18 0" color="#e6be6a"></a-torus>
      <a-cylinder radius="0.03" height="1.5" position="0 0.93 0" color="#e6be6a"></a-cylinder>
      <a-cone id="piece-2" radius-bottom="0.52" radius-top="0.17" height="0.92" position="0 1.32 0"
              material="color: #0e6b4e; roughness: 0.42"></a-cone>
    </a-entity>

    <!-- Pedestal 3 (Derecha): Pieza de exhibición -->
    <a-entity id="stand-3" position="2.6 0 -2.6">
      <a-cylinder radius="0.85" height="0.16" position="0 0.08 0" color="#073829"></a-cylinder>
      <a-torus radius="0.85" radius-tubular="0.02" rotation="90 0 0" position="0 0.16 0" color="#e6be6a"></a-torus>
      <a-cylinder radius="0.03" height="1.45" position="0 0.88 0" color="#e6be6a"></a-cylinder>
      <a-cone id="piece-3" radius-bottom="0.46" radius-top="0.15" height="0.85" position="0 1.25 0"
              material="color: #e8dec8; roughness: 0.45"></a-cone>
    </a-entity>

    <!-- Cámara navegable -->
    <a-entity id="cameraRig" position="0 1.6 2.8">
      <a-camera look-controls wasd-controls="enabled: false"></a-camera>
    </a-entity>
  </a-scene>

  <div class="hud">
    <div class="glass-bar">
      <div class="title-wrap">
        <span class="tag">D'Vitrales Mall · Boutique</span>
        <h1>Tienda — Exhibición & Venta</h1>
      </div>
      <div class="btn-row">
        <button id="btnToggleHud">Ocultar HUD</button>
        <a class="link-btn hud-collapsible" href="pasarela.html">Pasarela</a>
        <a class="link-btn hud-collapsible" href="vestidor.html">Vestidor</a>
        <a class="link-btn hud-collapsible" href="index.html">Inicio</a>
      </div>
    </div>

    <div class="item-card hud-collapsible">
      <div class="item-meta">
        <strong id="selectedTitle">Pieza Central · Colección Esmeralda</strong>
        <span id="selectedDesc">Toca un pedestal o cambia de pieza para revisar detalles.</span>
      </div>
      <div class="btn-row">
        <button data-piece="1">Pieza 1</button>
        <button class="active" data-piece="2">Pieza 2</button>
        <button data-piece="3">Pieza 3</button>
        <button id="btnApartar">Apartar</button>
      </div>
    </div>
  </div>

  <script>
    const PIECES = {
      1: {
        title: "Pieza 1 · Gala Girasol",
        desc: "Exhibición lateral izquierda · Disponible para consulta",
        cam: "-2.2 1.6 0.4"
      },
      2: {
        title: "Pieza 2 · Colección Esmeralda",
        desc: "Exhibición central · Tono esmeralda y detalles dorados",
        cam: "0 1.6 0.2"
      },
      3: {
        title: "Pieza 3 · Brisa Marfil",
        desc: "Exhibición lateral derecha · Diseño luminoso",
        cam: "2.2 1.6 0.4"
      }
    };

    let currentPiece = 2;

    function paintMarble() {
      const c = document.getElementById("storeMarble");
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#f2ede2";
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 22; i++) {
        ctx.beginPath();
        let x = (i * 39) % 512, y = 0;
        ctx.moveTo(x, y);
        while (y < 512) {
          y += 32;
          x += Math.sin((y + i * 20) * 0.03) * 14;
          ctx.lineTo(x, y);
        }
        ctx.strokeStyle = "rgba(180, 170, 152, 0.24)";
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }
    }

    function paintEmerald() {
      const c = document.getElementById("storeEmerald");
      const ctx = c.getContext("2d");
      const g = ctx.createLinearGradient(0, 0, 512, 512);
      g.addColorStop(0, "#062b20");
      g.addColorStop(0.5, "#0d523c");
      g.addColorStop(1, "#052219");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 512, 512);
    }

    function selectPiece(num) {
      currentPiece = Number(num);
      const info = PIECES[currentPiece];
      if (!info) return;
      document.getElementById("selectedTitle").textContent = info.title;
      document.getElementById("selectedDesc").textContent = info.desc;
      document.getElementById("cameraRig").setAttribute("position", info.cam);
      document.querySelectorAll("[data-piece]").forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.piece) === currentPiece);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      paintMarble();
      paintEmerald();

      document.getElementById("btnToggleHud").addEventListener("click", (e) => {
        document.body.classList.toggle("hud-clean");
        const clean = document.body.classList.contains("hud-clean");
        e.target.textContent = clean ? "Mostrar HUD" : "Ocultar HUD";
        e.target.classList.toggle("active", clean);
      });

      document.querySelectorAll("[data-piece]").forEach((btn) => {
        btn.addEventListener("click", () => selectPiece(btn.dataset.piece));
      });

      document.getElementById("btnApartar").addEventListener("click", () => {
        alert(`${PIECES[currentPiece].title} marcada para apartar/consultar.`);
      });
    });
  </script>
</body>
</html>
